<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baslam Tracker</title>
<meta name="description" content="Daily habit, work, gym and food tracker with weekly review and trends.">
<meta name="theme-color" content="#0A0B0A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F5F0" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baslam">
<script>
  try{var t=localStorage.getItem('baslam-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#0A0B0A; --bg-2:#111311; --card:#151715; --card-2:#1C1F1C; --line:#262A26; --line-2:#343934; --ctrl:#5C645C;
    --text:#F3F5EF; --text-2:#B9BEB5; --text-3:#7F867E;
    --accent:#C6F135; --accent-2:#A9D61D; --on-accent:#0B0F06; --accent-soft:rgba(198,241,53,.12); --accent-glow:rgba(198,241,53,.22);
    --warn:#F59E42; --warn-soft:rgba(245,158,66,.14); --danger:#F0665A; --danger-soft:rgba(240,102,90,.14); --good:#C6F135;
    --track:#242824; --focus:#8FD3FF;
    --edge:inset 0 1px 0 rgba(255,255,255,.05); --shadow:0 8px 28px rgba(0,0,0,.35);
    --btn-shadow:0 2px 0 rgba(0,0,0,.55),0 10px 24px rgba(0,0,0,.35);
    --ease-out:cubic-bezier(.2,.8,.2,1); --ease-settle:cubic-bezier(.22,1,.36,1);
    --nav-h:64px; --r:18px;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#F4F5F0; --bg-2:#ECEEE7; --card:#FFFFFF; --card-2:#F2F4EC; --line:#E1E4DA; --line-2:#CFD4C6; --ctrl:#9AA193;
    --text:#111411; --text-2:#4E554C; --text-3:#767D74;
    --accent:#6F9A00; --accent-2:#5C8200; --on-accent:#FFFFFF; --accent-soft:rgba(111,154,0,.12); --accent-glow:rgba(111,154,0,.18);
    --warn:#C26A12; --warn-soft:rgba(194,106,18,.12); --danger:#C2362B; --danger-soft:rgba(194,54,43,.12); --good:#6F9A00;
    --track:#E3E6DC; --focus:#1D6FD8;
    --edge:none; --shadow:0 1px 2px rgba(17,20,17,.05),0 10px 28px rgba(17,20,17,.07);
    --btn-shadow:0 2px 0 rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.08);
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{overscroll-behavior:contain}
  body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;transition:background-color .18s,color .18s}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 320px at 50% -80px,var(--accent-glow),transparent 70%);opacity:.9;z-index:0}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
  button,input,textarea,select,.habit,.row{transition:background-color .16s var(--ease-out),border-color .16s var(--ease-out),color .16s var(--ease-out),opacity .16s,transform .14s var(--ease-out),box-shadow .14s}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .disp{font-family:Sora,Inter,sans-serif;font-weight:700;letter-spacing:-.03em}
  .num{font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

  /* shell */
  .top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
  .top-in{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:var(--on-accent);box-shadow:0 6px 18px var(--accent-glow)}
  .logo svg{width:20px;height:20px}
  .brand b{font-family:Sora,sans-serif;font-weight:700;font-size:17px;letter-spacing:-.02em}
  .brand small{display:block;color:var(--text-3);font-size:11.5px;font-weight:500}
  .tools{display:flex;gap:6px;align-items:center}
  .icon-btn{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);background:var(--card);border:1px solid var(--line);box-shadow:var(--edge)}
  .icon-btn:hover{border-color:var(--line-2);color:var(--text)}
  .icon-btn:active{transform:translateY(1px)}
  .icon-btn[disabled]{opacity:.3;cursor:default}
  .icon-btn svg{width:19px;height:19px}
  .datepill{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;box-shadow:var(--edge)}
  .datepill .icon-btn{border:0;background:none;width:38px;height:38px;box-shadow:none}
  .datelbl{min-width:118px;text-align:center;font-family:Sora,sans-serif;font-weight:700;font-size:14px;letter-spacing:-.01em;cursor:pointer;line-height:1.1}
  .datelbl small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:10.5px;color:var(--accent)}
  .topnav{max-width:1100px;margin:0 auto;padding:0 20px 12px;display:none}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;box-shadow:var(--edge)}
  .seg button{min-height:38px;padding:0 16px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--text-3);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .seg button svg{width:16px;height:16px}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px var(--accent-glow)}
  .seg.small button{min-height:32px;padding:0 12px;font-size:12.5px}
  @media (min-width:900px){.topnav{display:block}}
  @media (max-width:560px){
    .brand small{display:none} .brand b{font-size:15px} .logo{width:30px;height:30px;border-radius:9px}
    .tools{gap:4px} .icon-btn{width:38px;height:38px;border-radius:11px} .datepill .icon-btn{width:34px;height:34px}
    .datelbl{min-width:92px;font-size:13px} .datelbl small{font-size:10px}
    .top-in{padding:10px 14px} main{padding-left:14px;padding-right:14px}
    .tiles{gap:8px} .tile{padding:12px 10px} .tile .v{font-size:24px} .delta{font-size:10.5px;padding:3px 7px;white-space:nowrap}
    .hero{gap:14px} .ring,.ring svg{width:84px;height:84px} .ring .cnt{font-size:26px} .hero .hl{font-size:23px}
  }
  .bottom{display:none}
  @media (max-width:899px){
    .bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:0 6px env(safe-area-inset-bottom)}
    .bottom button{flex:1;min-height:var(--nav-h);color:var(--text-3);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
    .bottom button.on{color:var(--accent)}
    .bottom button svg{width:22px;height:22px}
    .bottom .plus{flex:0 0 72px;position:relative}
    .bottom .plus span{width:56px;height:56px;border-radius:50%;background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--on-accent);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 10px 26px var(--accent-glow),0 2px 0 rgba(0,0,0,.4);border:4px solid var(--bg)}
    .bottom .plus span svg{width:26px;height:26px}
    .bottom .plus:active span{transform:translateY(2px)}
  }
  main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px 20px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom))}
  @media (min-width:900px){main{padding:8px 20px 60px}}
  section{animation:enter .22s var(--ease-out)}
  @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hidden{display:none!important}
  .cols{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
  @media (min-width:900px){.cols{grid-template-columns:5fr 7fr;gap:18px}.cols.even{grid-template-columns:1fr 1fr}}
  .stack{display:flex;flex-direction:column;gap:14px;min-width:0}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--edge),var(--shadow);min-width:0}
  .card h2{font-family:Sora,sans-serif;font-size:15px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
  .lead{color:var(--text-3);font-size:13px;margin:0 0 12px;line-height:1.45}
  .label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);margin:16px 0 8px}
  .label:first-child{margin-top:0}
  .h-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}

  /* hero */
  .hero{display:flex;align-items:center;gap:20px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--accent-glow),transparent 65%);pointer-events:none}
  .hero.unlocked{border-color:var(--accent)}
  .ring{width:96px;height:96px;position:relative;flex-shrink:0}
  .ring svg{width:96px;height:96px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:7;stroke-linecap:round}
  .ring .bgc{stroke:var(--track)}
  .ring .fgc{stroke:var(--accent);filter:drop-shadow(0 0 6px var(--accent-glow))}
  body.ready .ring .fgc{transition:stroke-dashoffset .64s var(--ease-settle)}
  .ring .cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
  .hero .hm{font-size:12px;color:var(--text-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
  .hero .hl{font-size:26px;line-height:1.1;margin:0}
  .hero .hr{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--text-2)}
  .hero .hr svg{width:15px;height:15px;color:var(--text-3)}
  .hero.unlocked .hr,.hero.unlocked .hr svg{color:var(--accent)}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tiles.two{grid-template-columns:repeat(2,1fr)}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--edge),var(--shadow);position:relative;min-width:0}
  .tile .t{font-size:11.5px;color:var(--text-3);font-weight:600;letter-spacing:.02em;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .v{font-size:28px;line-height:1;display:flex;align-items:baseline;gap:4px}
  .tile .v small{font-size:12px;color:var(--text-3);font-weight:600;font-family:Inter,sans-serif;letter-spacing:0}
  .delta{display:inline-flex;align-items:center;gap:3px;margin-top:8px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card-2);color:var(--text-3)}
  .delta.up{color:var(--accent);background:var(--accent-soft)} .delta.down{color:var(--danger);background:var(--danger-soft)}
  .delta svg{width:11px;height:11px}
  .tile.pulse{animation:pulse .7s var(--ease-settle)}
  .tile.pulse::after{content:"";position:absolute;inset:-1px;border-radius:16px;border:1px solid var(--accent);animation:ringout .7s var(--ease-out) forwards}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes ringout{from{opacity:1;inset:-1px}to{opacity:0;inset:-10px}}

  .alert{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px;font-size:13.5px;background:var(--warn-soft);color:var(--text-2);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
  .alert svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;color:var(--warn)}
  .alert b{color:var(--text);display:block;font-weight:700}
  .alert.ok{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)} .alert.ok svg{color:var(--accent)}

  /* habits and rows */
  .list{display:flex;flex-direction:column;gap:8px}
  .habit{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:11px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;box-shadow:var(--edge)}
  .habit:hover{border-color:var(--line-2)}
  .habit:active{transform:scale(.985)}
  .habit.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
  .disc{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ctrl);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background-color .16s var(--ease-out),border-color .16s var(--ease-out),transform .22s var(--ease-settle)}
  .disc svg{width:16px;height:16px;fill:none;stroke:var(--on-accent);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  .disc path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s var(--ease-out) .04s}
  .habit.on .disc{background:var(--accent);border-color:var(--accent);animation:pop .22s var(--ease-settle);box-shadow:0 0 0 4px var(--accent-soft)}
  .habit.on .disc path{stroke-dashoffset:0}
  @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  .htxt{flex:1;min-width:0}
  .htxt b{display:block;font-weight:600;font-size:15px;line-height:1.3}
  .htxt span{display:block;color:var(--text-3);font-size:12.5px;line-height:1.35;margin-top:1px}
  .row{display:flex;align-items:center;gap:12px;min-height:60px;padding:11px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--edge)}
  .row.c{flex-wrap:wrap}
  .row .htxt{flex:1 1 150px}
  .opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .opt{min-height:38px;min-width:42px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--card-2);font-weight:600;font-size:13px;color:var(--text-2);box-shadow:var(--edge)}
  .opt:hover{border-color:var(--ctrl);color:var(--text)}
  .opt:active{transform:translateY(1px)}
  .opt.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 12px var(--accent-glow)}
  .opt.on.quiet{background:var(--card);border-color:var(--ctrl);color:var(--text);box-shadow:var(--edge)}
  input[type=number],input[type=text],input[type=time],input[type=email],input[type=password],textarea,select{font:inherit;color:var(--text);background:var(--card-2);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;min-height:44px;box-shadow:var(--edge)}
  input[type=number]{width:84px;text-align:center;font-weight:700;font-family:Sora,sans-serif}
  input[type=time]{font-weight:600}
  input:hover,textarea:hover,select:hover{border-color:var(--ctrl)}
  textarea{width:100%;min-height:72px;resize:vertical;line-height:1.5}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:40px;height:40px;border-radius:999px;border:1px solid var(--line-2);background:var(--card-2);font-size:20px;font-weight:600;color:var(--text-2);display:flex;align-items:center;justify-content:center;box-shadow:var(--edge)}
  .step button:hover{border-color:var(--ctrl);color:var(--text)}
  .step button:active{transform:translateY(1px)}

  /* buttons */
  .btn{min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:linear-gradient(180deg,var(--card-2),var(--card));font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--text);box-shadow:var(--btn-shadow),var(--edge);font-family:Sora,sans-serif;letter-spacing:-.01em}
  .btn:hover{border-color:var(--ctrl)}
  .btn:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,0),var(--edge)}
  .btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));border-color:var(--accent-2);color:var(--on-accent);box-shadow:0 2px 0 rgba(0,0,0,.4),0 12px 28px var(--accent-glow)}
  .btn.danger{color:var(--danger)}
  .btn svg{width:17px;height:17px}
  .btn.block{width:100%}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* week grid + bars */
  .grid{display:grid;grid-template-columns:minmax(92px,1.2fr) repeat(7,1fr);gap:4px;align-items:center;font-size:13px}
  .grid .hd{text-align:center;color:var(--text-3);font-weight:600;font-size:11px;line-height:1.2;padding-bottom:4px}
  .grid .hd em{display:block;font-style:normal;color:var(--text);font-size:13px;font-weight:700;font-family:Sora,sans-serif}
  .grid .hd.today em{color:var(--accent)}
  .grid .lb{font-weight:500;padding-right:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2);font-size:12.5px}
  .cell{height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .cell svg{width:15px;height:15px}
  .c-ok{background:var(--accent);color:var(--on-accent)} .c-no{background:var(--card-2);color:var(--text-3);border:1px solid var(--line)} .c-na{color:var(--line-2)} .c-bl{background:var(--track);opacity:.6}
  .cell.score{font-weight:700;font-size:12px;color:var(--text-2);background:transparent}
  .bar{display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid var(--line)}
  .bar:last-child{border-bottom:0}
  .bar .lb{flex:1;font-weight:500;font-size:13.5px;color:var(--text-2)}
  .bar .tr{width:110px;height:7px;border-radius:4px;background:var(--track);overflow:hidden}
  .bar .tr i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .5s var(--ease-settle)}
  .bar .val{width:70px;text-align:right;font-weight:700;font-size:14px;font-family:Sora,sans-serif}
  .bar .val small{color:var(--text-3);font-weight:500;font-family:Inter,sans-serif}
  .chart{width:100%;height:auto;display:block;margin-top:4px}
  .chart text{font-family:Inter,sans-serif}

  /* heatmap */
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
  .heat i{display:block;width:12px;height:12px;border-radius:3px;background:var(--track)}
  .heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--track))} .heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--track))} .heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--track))} .heat i.l4{background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
  .heat i.today{outline:1.5px solid var(--text)}

  /* work */
  .biz{display:flex;align-items:center;gap:12px}
  .biz .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .sess{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .sess:last-child{border-bottom:0}
  .sess .tm{font-family:Sora,sans-serif;font-weight:700;white-space:nowrap;min-width:92px}
  .sess .tm small{display:block;color:var(--text-3);font-weight:500;font-family:Inter,sans-serif;font-size:11.5px}
  .sess .tx{flex:1;min-width:0} .sess .tx b{display:block;font-weight:600} .sess .tx span{color:var(--text-3);font-size:12.5px}
  .sess .del{color:var(--text-3);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center} .sess .del:hover{color:var(--danger);background:var(--danger-soft)} .sess .del svg{width:15px;height:15px}

// ---------- storage ----------
const KEY='baslam-tracker-v1';
const START='2026-10-20';
let db={entries:{},reviews:{},milestones:[],workouts:{},meals:{},work:{sessions:{},remak:{},goals:{}}};
try{const raw=localStorage.getItem(KEY); if(raw) db=Object.assign(db,JSON.parse(raw));}catch(e){}
function normalize(d){d=d&&typeof d==='object'?d:{};const w=d.work&&typeof d.work==='object'?d.work:{};return {entries:d.entries||{},reviews:d.reviews||{},milestones:Array.isArray(d.milestones)?d.milestones:[],workouts:d.workouts||{},meals:d.meals||{},work:{sessions:w.sessions||{},remak:w.remak||{},goals:w.goals||{}}};}
db=normalize(db);
let saveFailed=false;
function save(){ try{localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem('baslam-updated',String(Date.now()));saveFailed=false;}catch(e){saveFailed=true;} schedulePush(); }

// ---------- cloud sync (Supabase) ----------
const SB_URL='https://symkydchlaldltldwdte.supabase.co';
const SB_KEY='sb_publishable_RSaTe8CpLfOnVFjmurNq4w_k2KzwVZe';
const sb=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SB_URL,SB_KEY):null;
let user=null, pushTmr=null, syncState='local';
function setSync(s,title){syncState=s;const b=document.getElementById('cloudBtn');if(!b)return;b.className='icon-btn cloud '+s;b.title=title||({local:'Not signed in',synced:'Synced',syncing:'Syncing',offline:'Offline, saved on this device'})[s];}
function schedulePush(){if(!user||!sb)return;setSync('syncing');clearTimeout(pushTmr);pushTmr=setTimeout(push,800);}
async function push(){if(!user||!sb)return;const now=Date.now();try{const {error}=await sb.from('tracker_data').upsert({user_id:user.id,data:db,updated_at:new Date(now).toISOString()});if(error)throw error;setSync('synced');}catch(e){setSync('offline');}}
async function pull(){if(!user||!sb)return;setSync('syncing');try{const {data,error}=await sb.from('tracker_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;
  const local=Number(localStorage.getItem('baslam-updated')||0);
  if(data){const remote=new Date(data.updated_at).getTime();if(remote>local){db=normalize(data.data);try{localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem('baslam-updated',String(remote));}catch(e){}render();setSync('synced');}else if(local>remote){await push();}else setSync('synced');}
  else await push();
}catch(e){setSync('offline');}}
function showAuth(on){document.getElementById('auth').classList.toggle('open',on);}
async function initAuth(){

  const {data:{session}}=await sb.auth.getSession();

  sb.auth.onAuthStateChange((ev,s)=>{const was=user;user=s?s.user:null;if(user&&!was){showAuth(false);pull();}if(!user){setSync('local');}});
  const err=document.getElementById('authErr');

  document.getElementById('authIn').onclick=async()=>{err.textContent='';const {error}=await sb.auth.signInWithPassword(creds());if(error)err.textContent=error.message;};

  document.getElementById('authSkip').onclick=()=>{try{localStorage.setItem('baslam-skip-auth','1');}catch(e){}showAuth(false);};
}

// ---------- dates ----------
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const dow=s=>parse(s).getDay();
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{const d=parse(s);return `${DAYN[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;};
const short=s=>{const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]}`;};
const weekStart=s=>addDays(s,-((dow(s)+6)%7));
const today=()=>iso(new Date());
const mins=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m;};
const hrs=(a,b)=>{const x=mins(a),y=mins(b);if(x===null||y===null)return 0;let d=y-x;if(d<0)d+=1440;return Math.round(d/60*100)/100;};
const fmtH=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return M?`${H}h ${pad(M)}`:`${H}h`;};
let cur=today();
let tab='today';
let period='week';

// ---------- plan ----------
function blank(){return {clean:null,work:null,train:null,bed:null,wake:null,noFast:null,showerAm:null,showerPm:null,pages:null,mentalist:'none',weight:null,note:''};}
function get(s){return db.entries[s]||null;}
function isLogged(e){return !!e && (e.clean!==null||e.work!==null||e.train!==null||e.bed!==null||e.wake!==null||e.noFast!==null||e.showerAm!==null||e.showerPm!==null||e.pages!==null);}
function trainingRequired(s){const d=dow(s);return d===1||d===3||d===5||d===6;}
function trainingLabel(s){const d=dow(s);return d===6?'Swim day':d===1?'Push day':d===3?'Pull day':d===5?'Legs day':d===0?'Full rest':'Rest day';}
function workRequired(s){const d=dow(s);return d>=1&&d<=5;}
const ITEMS=[
  {key:'clean',label:'Clean day'},{key:'work',label:'Side work'},{key:'train',label:'Training'},
  {key:'sleep',label:'Sleep on time'},{key:'noFast',label:'No fast food'},{key:'shower',label:'Two showers'},{key:'read',label:'Reading'},
];
function sideHours(s){return (db.work.sessions[s]||[]).filter(x=>x.b!=='remak').reduce((a,x)=>a+hrs(x.s,x.e),0);}
function workVal(s){const e=get(s);const h=sideHours(s);if(h>0)return h;return e?e.work:null;}
function evalDay(s){
  const e=get(s)||blank(); const r={}; const wv=workVal(s);
  r.clean = e.clean===null?'blank':(e.clean?'ok':'no');
  r.work  = !workRequired(s)?'na':(wv===null?'blank':(wv>=1?'ok':'no'));
  r.train = !trainingRequired(s)?'na':(e.train===null?'blank':(e.train?'ok':'no'));
  r.sleep = (e.bed===null&&e.wake===null)?'blank':((e.bed&&e.wake)?'ok':'no');
  r.noFast= e.noFast===null?'blank':(e.noFast?'ok':'no');
  r.shower= (e.showerAm===null&&e.showerPm===null)?'blank':((e.showerAm&&e.showerPm)?'ok':'no');
  r.read  = e.pages===null?'blank':(e.pages>=5?'ok':'no');
  const req=ITEMS.filter(i=>r[i.key]!=='na');
  let pts=req.filter(i=>r[i.key]==='ok').length;
  if(e.mentalist==='before') pts=Math.max(0,pts-1);
  const logged=isLogged(e)||sideHours(s)>0;
  return {r,pts,req:req.length,score:req.length?Math.round(100*pts/req.length):0,logged,e};
}
function rewardUnlocked(s){const v=evalDay(s);const ok=k=>v.r[k]==='ok'||v.r[k]==='na';return ok('work')&&ok('train')&&ok('shower')&&ok('read');}
function streak(pred){
  let s=today(); let n=0;
  if(!evalDay(s).logged) s=addDays(s,-1);
  while(s>=START){const v=evalDay(s); if(!v.logged||!pred(v.e,s)) break; n++; s=addDays(s,-1);}
  return n;
}
const cleanStreak=()=>streak(x=>x.clean);

// ---------- helpers ----------
const $=sel=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function habit(title,sub,val,onChange){
  const b=h(`<button class="habit ${val?'on':''}" role="checkbox" aria-checked="${!!val}"><span class="disc">${I.check}</span><span class="htxt"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span></button>`);
  b.onclick=()=>onChange(!val); return b;
}
function opts(title,sub,list,val,onChange,quiet){
  const row=h(`<div class="row c"><div class="htxt"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</div><div class="opts" role="radiogroup" aria-label="${esc(title)}"></div></div>`);
  list.forEach(([l,v])=>{const c=h(`<button class="opt ${val===v?'on':''} ${quiet&&quiet.includes(v)?'quiet':''}" role="radio" aria-checked="${val===v}">${l}</button>`);c.onclick=()=>onChange(v);row.querySelector('.opts').appendChild(c);});
  return row;
}
function stepper(title,sub,val,step,onChange,ph){
  const row=h(`<div class="row"><div class="htxt"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</div><div class="step"><button aria-label="Less">−</button><input type="number" min="0" step="${step}" value="${val??''}" placeholder="${ph}" aria-label="${esc(title)}"><button aria-label="More">+</button></div></div>`);
  const inp=row.querySelector('input'); const [m,p]=row.querySelectorAll('button');
  inp.onchange=()=>onChange(inp.value===''?null:Number(inp.value));
  m.onclick=()=>onChange(Math.max(0,(Number(inp.value)||0)-step));
  p.onclick=()=>onChange((Number(inp.value)||0)+step);
  return row;
}
function tile(t,v,unit,delta,deltaText,extra){
  const d=delta===null||delta===undefined?'':`<div class="delta ${delta>0?'up':delta<0?'down':''}">${delta>0?I.up:delta<0?I.down:''}${deltaText}</div>`;
  return `<div class="tile ${extra||''}"><div class="t">${t}</div><div class="v disp num">${v}${unit?`<small>${unit}</small>`:''}</div>${d}</div>`;
}
function segment(items,val,onChange,small){
  const s=h(`<div class="seg ${small?'small':''}"></div>`);
  items.forEach(([k,l])=>{const b=h(`<button class="${val===k?'on':''}">${l}</button>`);b.onclick=()=>onChange(k);s.appendChild(b);});
  return s;
}

// ---------- milestones ----------
let pulseKey=null;
function checkMilestone(){
  const n=cleanStreak(); if(![7,14,28].includes(n)) return;
  const k=`clean-${n}-${today()}`;
  if(db.milestones.includes(k)) return;
  db.milestones.push(k); save(); pulseKey=k;
}

// ---------- Work ----------
const BIZ={
  vts:{n:'VTS',color:'#C6F135',cats:['Marketing','App','Planning','Finance','Sales'],type:'side'},
  salma:{n:'Salma Plas',color:'#5EC8F5',cats:['Production tracker','Meetings','Accountability','Finance','Operations'],type:'side'},
  remak:{n:'Remak',color:'#F59E42',cats:[],type:'job'},
};
function sessionsFor(s){if(!db.work.sessions[s])db.work.sessions[s]=[];return db.work.sessions[s];}
function remakFor(s){if(!db.work.remak[s])db.work.remak[s]={in:'',out:'',n:''};return db.work.remak[s];}
function goalsFor(m){if(!db.work.goals[m])db.work.goals[m]={vts:[],salma:[],remak:[]};const g=db.work.goals[m];['vts','salma','remak'].forEach(k=>{if(!Array.isArray(g[k]))g[k]=[];});return g;}
function bizHours(b,days){let t=0;days.forEach(s=>{if(b==='remak'){const r=db.work.remak[s];if(r&&r.in&&r.out)t+=hrs(r.in,r.out);}else (db.work.sessions[s]||[]).forEach(x=>{if(x.b===b)t+=hrs(x.s,x.e);});});return t;}
function bizCatHours(b,days){const o={};days.forEach(s=>(db.work.sessions[s]||[]).forEach(x=>{if(x.b===b){o[x.c||'Other']=(o[x.c||'Other']||0)+hrs(x.s,x.e);}}));return o;}
function bizOutputs(b,days){let n=0;days.forEach(s=>(db.work.sessions[s]||[]).forEach(x=>{if(x.b===b&&x.n&&x.n.trim())n++;}));return n;}
function lastTouched(b){const ds=Object.keys(db.work.sessions).filter(s=>(db.work.sessions[s]||[]).some(x=>x.b===b)).sort();return ds[ds.length-1]||null;}
function workFlags(days){
  const f=[]; const t0=today();
  ['vts','salma'].forEach(b=>{const hrsB=bizHours(b,days),out=bizOutputs(b,days);if(hrsB>=3&&out===0)f.push(`${BIZ[b].n}: ${fmtH(hrsB)} this week and not one "what moved" line. Hours without outputs.`);
    const lt=lastTouched(b);if(lt&&addDays(lt,7)<t0)f.push(`${BIZ[b].n}: untouched since ${short(lt)}.`);});
  const late=days.reduce((a,s)=>a+(db.work.sessions[s]||[]).filter(x=>x.b!=='remak'&&mins(x.s)>=21*60+30).length,0);
  if(late>=2)f.push(`${late} side-work sessions started after 21:30 this week. Bedtime is losing.`);
  const lateIn=days.filter(s=>{const r=db.work.remak[s];return r&&r.in&&mins(r.in)>8*60+10;}).length;
  if(lateIn>=3)f.push(`Remak: arrived after 08:10 on ${lateIn} days this week.`);
  return f;
}
function renderWork(){
  const root=$('#tab-work'); root.innerHTML='';
  const days=weekDays(cur), prev=weekDays(addDays(cur,-7)), m=days[0];
  const A=h(`<div class="stack"></div>`), B=h(`<div class="stack"></div>`);
  const g=goalsFor(m);
  const tiles=['vts','salma','remak'].map(b=>{const hN=bizHours(b,days),hP=bizHours(b,prev);const goals=g[b].filter(x=>x.t);const done=goals.filter(x=>x.done).length;return tile(BIZ[b].n,fmtH(hN),goals.length?`${done}/${goals.length} goals`:'',Math.round((hN-hP)*10),`${hN-hP>=0?'+':''}${fmtH(Math.abs(hN-hP))} vs prev`);}).join('');
  A.appendChild(h(`<div class="tiles">${tiles}</div>`));
  const fl=workFlags(days);
  A.appendChild(h(fl.length?`<div class="alert">${I.alert}<div><b>Flags this week</b>${fl.map(esc).join('<br>')}</div></div>`:`<div class="alert ok">${I.tick}<div><b>No flags this week</b>Hours have outputs, nothing is untouched, nights are protected.</div></div>`));

  // log a session
  const f=h(`<div class="card"><h2>Log a session · ${fmt(cur)}</h2><p class="lead">Start, end, what, and one line on what moved. Twenty seconds.</p>
    <div class="form">
      <div><label>Business</label><select id="wB"><option value="vts">VTS</option><option value="salma">Salma Plas</option></select></div>
      <div><label>Category</label><select id="wC"></select></div>
      <div><label>Start</label><input type="time" id="wS" value="18:45"></div>
      <div><label>End</label><input type="time" id="wE" value="21:45"></div>
      <div class="full"><label>What moved</label><input type="text" id="wN" placeholder="e.g. Published 2 reels, finished invoice flow, agreed Q4 plan with Ahmed" maxlength="140"></div>
    </div>
    <div class="btns"><button class="btn primary" id="wAdd">${I.plus} Add session</button></div></div>`);
  const sB=f.querySelector('#wB'),sC=f.querySelector('#wC');
  const fillCats=()=>{sC.innerHTML=BIZ[sB.value].cats.map(c=>`<option>${c}</option>`).join('');};fillCats();sB.onchange=fillCats;
  f.querySelector('#wAdd').onclick=()=>{const s=f.querySelector('#wS').value,e=f.querySelector('#wE').value;if(!s||!e){alert('Start and end time are needed.');return;}if(hrs(s,e)<0.25){alert('Shorter than 15 minutes is not worth logging.');return;}sessionsFor(cur).push({b:sB.value,s,e,c:sC.value,n:f.querySelector('#wN').value.trim()});save();render();};
  A.appendChild(f);

  // remak
  const r=remakFor(cur);
  const rk=h(`<div class="card"><div class="h-row"><h2 class="biz"><span class="dot" style="background:${BIZ.remak.color}"></span>Remak · ${fmt(cur)}</h2><span class="muted num">${r.in&&r.out?fmtH(hrs(r.in,r.out)):''}</span></div>
    <div class="form"><div><label>Clock in</label><input type="time" id="rIn" value="${r.in}"></div><div><label>Clock out</label><input type="time" id="rOut" value="${r.out}"></div>
    <div class="full"><label>What I did or learned</label><input type="text" id="rN" value="${esc(r.n)}" placeholder="One line. What can I do now that I could not do last month?" maxlength="160"></div></div>
    ${r.in&&mins(r.in)>8*60+10?`<p class="muted" style="margin:10px 0 0;color:var(--warn)">Arrived after 08:10.</p>`:''}</div>`);
  rk.querySelector('#rIn').onchange=ev=>{r.in=ev.target.value;save();render();};
  rk.querySelector('#rOut').onchange=ev=>{r.out=ev.target.value;save();render();};
  rk.querySelector('#rN').onchange=ev=>{r.n=ev.target.value;save();};
  A.appendChild(rk);

  // sessions for the day
  const ss=sessionsFor(cur);
  const sl=h(`<div class="card"><h2>Sessions · ${fmt(cur)}</h2><p class="lead">${ss.length?`${fmtH(ss.reduce((a,x)=>a+hrs(x.s,x.e),0))} logged.`:'Nothing logged for this day yet.'}</p></div>`);
  ss.slice().sort((a,b)=>mins(a.s)-mins(b.s)).forEach((x,i)=>{const row=h(`<div class="sess"><div class="tm num">${x.s}–${x.e}<small>${fmtH(hrs(x.s,x.e))}</small></div><div class="tx"><b><span style="color:${BIZ[x.b].color}">●</span> ${BIZ[x.b].n} · ${esc(x.c)}</b><span>${x.n?esc(x.n):'<i>No output noted</i>'}</span></div><button class="del" aria-label="Delete session">${I.trash}</button></div>`);row.querySelector('.del').onclick=()=>{const idx=ss.indexOf(x);if(idx>-1){ss.splice(idx,1);save();render();}};sl.appendChild(row);});
  B.appendChild(sl);

  // weekly goals
  const gc=h(`<div class="card"><h2>Goals · week of ${short(m)}</h2><p class="lead">Three outcomes per business, set on Sunday. Outcomes, not tasks: "post three reels", not "work on marketing". Tick them as they land.</p></div>`);
  ['vts','salma','remak'].forEach(b=>{gc.appendChild(h(`<div class="label" style="display:flex;align-items:center;gap:8px"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${BIZ[b].color};display:inline-block"></span>${BIZ[b].n}</div>`));
    for(let i=0;i<3;i++){const goal=g[b][i]||(g[b][i]={t:'',done:false});const row=h(`<div class="goal ${goal.done?'on':''}"><span class="disc" role="checkbox" aria-checked="${goal.done}" tabindex="0">${I.check}</span><input type="text" placeholder="Outcome ${i+1}" value="${esc(goal.t)}" maxlength="90"></div>`);
      row.querySelector('.disc').onclick=()=>{if(!goal.t)return;goal.done=!goal.done;save();render();};row.querySelector('input').onchange=ev=>{goal.t=ev.target.value.trim();save();};gc.appendChild(row);}});
  B.appendChild(gc);

  // week table per business
  const wt=h(`<div class="card"><h2>This week by business</h2><p class="lead">Hours by category, outputs noted, and when in the day the work happened.</p></div>`);
  ['vts','salma'].forEach(b=>{const cats=bizCatHours(b,days);const tot=bizHours(b,days);const out=bizOutputs(b,days);const starts=days.flatMap(s=>(db.work.sessions[s]||[]).filter(x=>x.b===b).map(x=>mins(x.s)));const avgStart=starts.length?Math.round(starts.reduce((a,c)=>a+c,0)/starts.length):null;
    wt.appendChild(h(`<div class="label" style="display:flex;align-items:center;gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:${BIZ[b].color};display:inline-block"></span>${BIZ[b].n} · ${fmtH(tot)} · ${out} output${out===1?'':'s'}${avgStart!==null?` · usually starts ${pad(Math.floor(avgStart/60))}:${pad(avgStart%60)}`:''}</div>`));
    const max=Math.max(1,...Object.values(cats));
    Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([c,hh])=>wt.appendChild(h(`<div class="bar"><div class="lb">${esc(c)}</div><div class="tr"><i style="width:${Math.round(100*hh/max)}%"></i></div><div class="val num">${fmtH(hh)}</div></div>`)));
    if(!Object.keys(cats).length)wt.appendChild(h(`<p class="muted" style="margin:0 0 6px">No sessions this week.</p>`));});
  const rIns=days.map(s=>db.work.remak[s]).filter(x=>x&&x.in&&x.out);
  wt.appendChild(h(`<div class="label" style="display:flex;align-items:center;gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:${BIZ.remak.color};display:inline-block"></span>Remak · ${rIns.length} day${rIns.length===1?'':'s'} · ${fmtH(bizHours('remak',days))}</div>`));
  days.forEach(s=>{const x=db.work.remak[s];if(x&&(x.in||x.out))wt.appendChild(h(`<div class="sess"><div class="tm num">${DAYN[dow(s)]} ${parse(s).getDate()}<small>${x.in||'–'} → ${x.out||'–'}</small></div><div class="tx"><span>${x.n?esc(x.n):'<i>No line for the day</i>'}</span></div></div>`));});
  B.appendChild(wt);

  const cols=h(`<div class="cols"></div>`);cols.appendChild(A);cols.appendChild(B);root.appendChild(cols);
}

// ---------- Stats ----------
function weekDays(s){const m=weekStart(s);return [0,1,2,3,4,5,6].map(i=>addDays(m,i));}
function weekTotals(days){
  const t={gym:0,swim:0,work:0,pages:0,bed:0,clean:0,noFast:0,logged:0,score:0,weights:[],meals:0,heat:0};
  days.forEach(s=>{const v=evalDay(s);const e=v.e;t.work+=workVal(s)||0;if(mealCount(s)>=5)t.meals++;if(recTotal(db.workouts[s])>0)t.heat++;if(!v.logged)return;t.logged++;t.score+=v.score;
    if(e.train){if(dow(s)===6)t.swim++;else t.gym++;}
    t.pages+=e.pages||0;if(e.bed)t.bed++;if(e.clean)t.clean++;if(e.noFast)t.noFast++;if(e.weight)t.weights.push(e.weight);});
  t.work=Math.round(t.work*100)/100;
  t.avg=t.logged?Math.round(t.score/t.logged):0;
  t.wavg=t.weights.length?Number((t.weights.reduce((a,b)=>a+b,0)/t.weights.length).toFixed(1)):null;
  return t;
}
function rangeDays(n,end){const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(end,-i));return a;}
function periodTotals(days){
  const t={score:0,logged:0,clean:0,pages:0,work:0,vts:0,salma:0,remak:0,gym:0,weights:[],meals:0};
  days.forEach(s=>{const v=evalDay(s);if(v.logged){t.logged++;t.score+=v.score;if(v.e.clean)t.clean++;t.pages+=v.e.pages||0;if(v.e.train&&dow(s)!==6)t.gym++;if(v.e.weight)t.weights.push(v.e.weight);}t.work+=workVal(s)||0;if(mealCount(s)>=5)t.meals++;});
  t.vts=bizHours('vts',days);t.salma=bizHours('salma',days);t.remak=bizHours('remak',days);
  t.avg=t.logged?Math.round(t.score/t.logged):0;t.wavg=t.weights.length?Number((t.weights.reduce((a,b)=>a+b,0)/t.weights.length).toFixed(1)):null;
  return t;
}
function bars(vals,labels,max,showVals,goal){

  [0,0.5,1].forEach(f=>{s+=`<line x1="${Lm}" x2="${W-8}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="currentColor" opacity=".1"/><text x="${Lm-6}" y="${y(max*f)+4}" font-size="10" text-anchor="end" fill="currentColor" opacity=".5">${Math.round(max*f)}</text>`;});
  if(goal) s+=`<line x1="${Lm}" x2="${W-8}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".8"/>`;
  vals.forEach((v,i)=>{if(v===null)return;const x=Lm+i*bw;s+=`<rect x="${x+2}" y="${y(v)}" width="${Math.max(2,bw-4)}" height="${H-B-y(v)}" rx="3" fill="var(--accent)" opacity="${v>=(goal||max)?1:.55}"/>`;if(showVals)s+=`<text x="${x+bw/2}" y="${y(v)-4}" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor">${v}</text>`;});

  const hm=h(`<div class="card"><h2>Consistency</h2><p class="lead">One cell per day, last 20 weeks. Brighter is a higher day score.</p><div class="heat"></div></div>`);
  const hg=hm.querySelector('.heat'); const endW=weekStart(t0); let start=addDays(endW,-7*19);
  for(let i=0;i<140;i++){const s=addDays(start,i);const v=s<=t0?evalDay(s):null;const sc=v&&v.logged?v.score:null;const lvl=sc===null?'':sc>=100?'l4':sc>=75?'l3':sc>=50?'l2':'l1';hg.appendChild(h(`<i class="${lvl} ${s===t0?'today':''}" title="${fmt(s)}${sc!==null?' · '+sc+'%':''}"></i>`));}
  A.appendChild(hm);
  // week grid
  const wd=weekDays(cur), wt=weekTotals(wd);
  const cell=v=>v==='ok'?`<div class="cell c-ok">${I.tick}</div>`:v==='no'?`<div class="cell c-no">${I.x}</div>`:v==='na'?`<div class="cell c-na">${I.dash}</div>`:'<div class="cell c-bl"></div>';
  let g=`<div></div>${wd.map(s=>`<div class="hd ${s===t0?'today':''}">${DAYN[dow(s)]}<em>${parse(s).getDate()}</em></div>`).join('')}`;
  ITEMS.forEach(i=>{g+=`<div class="lb">${i.label}</div>${wd.map(s=>cell(evalDay(s).r[i.key])).join('')}`;});
  g+=`<div class="lb" style="color:var(--text)">Score</div>${wd.map(s=>{const v=evalDay(s);return `<div class="cell score num">${v.logged?v.score+'%':'·'}</div>`;}).join('')}`;
  A.appendChild(h(`<div class="card"><h2>Week of ${short(wd[0])}</h2><p class="lead">Average ${wt.avg}%. Use the arrows above to change week.</p><div class="grid">${g}</div></div>`));
  const bar=(label,val,goal,unit='')=>{const pc=Math.min(100,Math.round(100*val/goal));return `<div class="bar"><div class="lb">${label}</div><div class="tr"><i style="width:${pc}%"></i></div><div class="val num">${val}${unit}<small> / ${goal}</small></div></div>`;};
  A.appendChild(h(`<div class="card"><h2>Weekly targets</h2>${bar('Gym sessions',wt.gym,3)}${bar('Swim',wt.swim,1)}${bar('Side work',wt.work,15,' h')}${bar('Pages read',wt.pages,70)}${bar('In bed by 23:00',wt.bed,6)}${bar('Clean days',wt.clean,7)}${bar('Fast-food-free days',wt.noFast,7)}${bar('Days with 5+ meals',wt.meals,7)}${bar('Heat visits, max 3',wt.heat,3)}${bar('Days logged',wt.logged,7)}</div>`));
  // charts
  const sc=days.slice(-28).map(s=>{const v=evalDay(s);return v.logged?v.score:null;});
  const lbl28=days.slice(-28).map((s,i)=>i%7===0?short(s):'');
  B.appendChild(h(`<div class="card"><h2>Day score, last 28 days</h2><p class="lead">Watch the average, not a single day. Gaps are days not logged.</p>${bars(sc,lbl28,100,false)}</div>`));
  const wk=[];for(let i=5;i>=0;i--)wk.push(weekStart(addDays(t0,-7*i)));const wts=wk.map(mm=>weekTotals(weekDays(mm)));const lbl=wk.map(short);
  B.appendChild(h(`<div class="card"><h2>Side work per week</h2><p class="lead">Hours, VTS and Salma Plas. Dashed line is the 15-hour target.</p>${bars(wts.map(x=>Math.round(x.work)),lbl,Math.max(16,...wts.map(x=>x.work)),true,15)}</div>`));
  B.appendChild(h(`<div class="card"><h2>Pages per week</h2><p class="lead">Dashed line is the 70-page target.</p>${bars(wts.map(x=>x.pages),lbl,Math.max(80,...wts.map(x=>x.pages)),true,70)}</div>`));
  B.appendChild(h(`<div class="card"><h2>Clean days per week</h2>${bars(wts.map(x=>x.clean),lbl,7,true,7)}</div>`));
  const ws=wts.map(x=>x.wavg);if(ws.some(x=>x!==null))B.appendChild(h(`<div class="card"><h2>Weekly average weight</h2><p class="lead">Dashed line is the 65 kg goal.</p>${bars(ws,lbl,70,true,65)}</div>`));
  const lifts=EXALL.filter(d=>!d.time&&!d.bw);
  const rows=lifts.map(d=>{const s=gymSessionsFor(d.k,addDays(t0,1));if(!s.length)return '';const first=effT(d,s[s.length-1]),now=effT(d,s[0]),delta=now-first;return `<div class="bar"><div class="lb">${d.n}</div><div class="val num" style="width:auto">${now} kg <small>${delta>0?'+'+delta+' kg':s.length===1?'first':'no change'}</small></div></div>`;}).join('');
  B.appendChild(h(`<div class="card"><h2>Strength</h2><p class="lead">Current working weight per lift.</p>${rows||'<p class="muted" style="margin:0">No sessions logged yet.</p>'}</div>`));
  // review
  const m=wd[0]; const rv=db.reviews[m]||(db.reviews[m]={keep:'',fix:'',focus:'',avoided:'',wasted:''});
  const rates=ITEMS.map(i=>{let ok=0,n=0;wd.forEach(s=>{const v=evalDay(s);if(!v.logged||v.r[i.key]==='na')return;n++;if(v.r[i.key]==='ok')ok++;});return {label:i.label,rate:n?Math.round(100*ok/n):null,n};});
  const bucket=r=>r.rate===null?'No data':r.rate>=80?'Keep':r.rate>=40?'Fix':'Rethink';
  const cls=b=>b==='Keep'?'p-keep':b==='Fix'?'p-fix':b==='Rethink'?'p-re':'p-none';
  B.appendChild(h(`<div class="card"><h2>Habit sorting · week of ${short(m)}</h2><p class="lead">Keep at 80 % or more. Fix between 40 and 80 %: change the trigger, not the goal. Rethink under 40 % two weeks running.</p>${rates.map(r=>`<div class="sortrow"><div class="htxt"><b>${r.label}</b><span>${r.rate===null?'nothing logged':r.rate+' % of '+r.n+' days'}</span></div><span class="pill ${cls(bucket(r))}">${bucket(r)}</span></div>`).join('')}</div>`));
  const f=h(`<div class="card"><h2>Sunday review</h2><p class="lead">Ten minutes. Saved as you type.</p>
    <label class="fl" for="rk">Keep<small>What worked this week?</small></label><textarea id="rk" data-k="keep"></textarea>
    <label class="fl" for="rf">Fix<small>What kept failing, and the one trigger you will change.</small></label><textarea id="rf" data-k="fix"></textarea>
    <label class="fl" for="ra">Avoided<small>What did I avoid this week, and why?</small></label><textarea id="ra" data-k="avoided"></textarea>
    <label class="fl" for="rw">Wasted<small>What took time and produced nothing?</small></label><textarea id="rw" data-k="wasted"></textarea>
    <label class="fl" for="ro">Focus<small>One item for next week.</small></label><input id="ro" type="text" data-k="focus" style="width:100%">
    <div class="saved" id="savedMsg"></div></div>`);
  let tmr;f.querySelectorAll('[data-k]').forEach(el=>{el.value=rv[el.dataset.k]||'';el.oninput=()=>{rv[el.dataset.k]=el.value;clearTimeout(tmr);tmr=setTimeout(()=>{save();const s=$('#savedMsg');if(s)s.textContent=saveFailed?'Not saved. Storage is blocked.':'Saved';},400);};el.onblur=()=>{save();};});
  B.appendChild(f);
  const past=Object.keys(db.reviews).filter(k=>k!==m&&(db.reviews[k].keep||db.reviews[k].fix||db.reviews[k].focus)).sort().reverse();
  if(past.length)B.appendChild(h(`<div class="card"><h2>Past reviews</h2>${past.map(k=>`<div class="past"><b>Week of ${short(k)}</b><div>Keep: ${esc(db.reviews[k].keep||'–')}</div><div>Fix: ${esc(db.reviews[k].fix||'–')}</div>${db.reviews[k].avoided?`<div>Avoided: ${esc(db.reviews[k].avoided)}</div>`:''}${db.reviews[k].wasted?`<div>Wasted: ${esc(db.reviews[k].wasted)}</div>`:''}<div>Focus: ${esc(db.reviews[k].focus||'–')}</div></div>`).join('')}</div>`));
  const cols=h(`<div class="cols"></div>`);cols.appendChild(A);cols.appendChild(B);root.appendChild(cols);
}

// ---------- Report ----------
function buildReport(){
  const t0=today(); const from=START<t0?START:t0;
  const weeks=[]; for(let m=weekStart(from); m<=t0; m=addDays(m,7)) weeks.push(m);
  const ok=v=>v==='ok'?'✓':v==='no'?'✗':v==='na'?'–':'';
  let html=`<h1>Baslam · Progress report</h1><p class="m">Generated ${fmt(t0)} · Programme from ${fmt(START)} · Clean-day streak ${cleanStreak()}</p>`;
  html+=`<h2>Weekly summary</h2><table><tr><th>Week of</th><th>Logged</th><th>Avg score</th><th>Clean</th><th>Bed 23:00</th><th>Gym</th><th>Swim</th><th>VTS h</th><th>Salma h</th><th>Remak h</th><th>Pages</th><th>5+ meals</th><th>Weight</th></tr>`;
  weeks.forEach(m=>{const d=weekDays(m);const t=weekTotals(d);html+=`<tr><td>${short(m)}</td><td>${t.logged}/7</td><td>${t.avg}%</td><td>${t.clean}</td><td>${t.bed}</td><td>${t.gym}/3</td><td>${t.swim}/1</td><td>${fmtH(bizHours('vts',d))}</td><td>${fmtH(bizHours('salma',d))}</td><td>${fmtH(bizHours('remak',d))}</td><td>${t.pages}/70</td><td>${t.meals}</td><td>${t.wavg?t.wavg+' kg':''}</td></tr>`;});
  html+=`</table><h2>Work sessions</h2><table><tr><th>Date</th><th>Business</th><th>Time</th><th>Category</th><th>What moved</th></tr>`;
  Object.keys(db.work.sessions).sort().forEach(s=>db.work.sessions[s].forEach(x=>{html+=`<tr><td>${short(s)}</td><td>${BIZ[x.b].n}</td><td>${x.s}–${x.e} (${fmtH(hrs(x.s,x.e))})</td><td>${esc(x.c)}</td><td>${esc(x.n)}</td></tr>`;}));
  html+=`</table><h2>Remak</h2><table><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th><th>Note</th></tr>`;
  Object.keys(db.work.remak).sort().forEach(s=>{const r=db.work.remak[s];if(r.in||r.out||r.n)html+=`<tr><td>${short(s)}</td><td>${r.in}</td><td>${r.out}</td><td>${r.in&&r.out?fmtH(hrs(r.in,r.out)):''}</td><td>${esc(r.n)}</td></tr>`;});
  html+=`</table><h2>Weekly goals</h2><table><tr><th>Week of</th><th>Business</th><th>Goal</th><th>Done</th></tr>`;
  Object.keys(db.work.goals).sort().forEach(m=>['vts','salma','remak'].forEach(b=>(db.work.goals[m][b]||[]).forEach(gl=>{if(gl.t)html+=`<tr><td>${short(m)}</td><td>${BIZ[b].n}</td><td>${esc(gl.t)}</td><td>${gl.done?'✓':''}</td></tr>`;})));
  html+=`</table><h2>Strength</h2><table><tr><th>Lift</th><th>First</th><th>Now</th><th>Change</th><th>Sessions</th></tr>`;
  EXALL.filter(d=>!d.time&&!d.bw).forEach(d=>{const s=gymSessionsFor(d.k,addDays(t0,1));if(!s.length)return;const f=effT(d,s[s.length-1]),n=effT(d,s[0]);html+=`<tr><td>${d.n}</td><td>${f} kg</td><td>${n} kg</td><td>${n-f>=0?'+':''}${n-f} kg</td><td>${s.length}</td></tr>`;});
  html+=`</table><h2>Day by day</h2><table><tr><th>Date</th><th>Score</th>${ITEMS.map(i=>`<th>${i.label}</th>`).join('')}<th>Pages</th><th>Meals</th><th>Weight</th><th>Note</th></tr>`;
  Object.keys(db.entries).filter(k=>evalDay(k).logged&&k<=t0).sort().forEach(s=>{const v=evalDay(s);const e=v.e;html+=`<tr><td>${short(s)}</td><td>${v.score}%</td>${ITEMS.map(i=>`<td>${ok(v.r[i.key])}</td>`).join('')}<td>${e.pages??''}</td><td>${mealCount(s)||''}</td><td>${e.weight??''}</td><td>${esc(e.note||'')}</td></tr>`;});
  html+=`</table>`;
  const rv=Object.keys(db.reviews).filter(k=>db.reviews[k].keep||db.reviews[k].fix||db.reviews[k].focus).sort();
  if(rv.length){html+=`<h2>Sunday reviews</h2><table><tr><th>Week of</th><th>Keep</th><th>Fix</th><th>Avoided</th><th>Wasted</th><th>Focus</th></tr>`;rv.forEach(k=>{const r=db.reviews[k];html+=`<tr><td>${short(k)}</td><td>${esc(r.keep)}</td><td>${esc(r.fix)}</td><td>${esc(r.avoided||'')}</td><td>${esc(r.wasted||'')}</td><td>${esc(r.focus)}</td></tr>`;});html+=`</table>`;}
  html+=`<h2>Backup data</h2><p class="m" style="font-family:monospace;font-size:7px;word-break:break-all">${esc(JSON.stringify(db))}</p>`;
  $('#report').innerHTML=html;
}
function printReport(){buildReport();closeSheet();setTimeout(()=>window.print(),150);}

// ---------- Sheets ----------
function openQuick(){
  const s=$('#sheetIn'); s.innerHTML='';
  s.appendChild(h(`<div><h2>Quick log</h2><p class="lead">What do you want to log?</p><div class="quick">
    <button class="btn primary" data-go="work">${I.work}Work session</button><button class="btn" data-go="remak">${I.clock}Remak in / out</button>
    <button class="btn" data-go="food">${I.food}Meals</button><button class="btn" data-go="gym">${I.gym}Gym sets</button>
    <button class="btn" data-go="weight">${I.scale}Weight</button><button class="btn" data-go="stats">${I.stats}Stats and review</button></div>
    <div class="btns"><button class="btn block" id="qClose">Close</button></div></div>`));
  s.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closeSheet();const g=b.dataset.go;if(g==='weight'){switchTab('today');}else if(g==='remak'){switchTab('work');}else switchTab(g);});
  s.querySelector('#qClose').onclick=closeSheet;
  $('#sheet').classList.add('open');
}
function openSheet(){
  const n=Object.keys(db.entries).filter(k=>evalDay(k).logged).length;
  const s=$('#sheetIn'); s.innerHTML='';
  s.appendChild(h(`<div><h2>Settings</h2>
    <p class="lead">${user?`Signed in as ${esc(user.email)}. ${syncState==='synced'?'Everything is synced.':syncState==='offline'?'Offline right now, saved on this device and pushed when back online.':'Syncing.'}`:'Not signed in. Data lives in this browser only.'}</p>
    <div class="btns" style="margin-top:0;margin-bottom:14px">${user?`<button class="btn" id="signout">Sign out</button>`:`<button class="btn primary" id="signin">Sign in or create account</button>`}</div>
    <h2>Backup</h2><p class="lead">${n} day${n===1?'':'s'} logged. Copy a backup now and then and keep it in a note.</p>
    <textarea id="bak" aria-label="Backup text" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;min-height:60px" placeholder="Backup text appears here. Paste a backup here to import."></textarea>
    <div class="btns"><button class="btn primary" id="exp">${I.copy} Copy backup</button><button class="btn" id="imp">${I.upload} Import</button><button class="btn danger" id="clr">${I.trash} Clear all</button></div>
    <h2 style="margin-top:18px">Progress report</h2><p class="lead">Every week, every session, every lift, every day and your reviews in one document. Save as PDF and share it.</p>
    <div class="btns"><button class="btn primary" id="rep">${I.doc} Make PDF report</button><button class="btn" id="close">Close</button></div></div>`));
  $('#rep').onclick=printReport;
  if($('#signout'))$('#signout').onclick=signOut;
  if($('#signin'))$('#signin').onclick=()=>{closeSheet();showAuth(true);};
  const bak=$('#bak');
  $('#exp').onclick=()=>{bak.value=JSON.stringify(db);bak.select();try{navigator.clipboard.writeText(bak.value);alert('Backup copied to clipboard.');}catch(e){alert('Backup shown in the box. Select and copy it.');}};
  $('#imp').onclick=()=>{try{const d=JSON.parse(bak.value);if(d&&d.entries){db=normalize(d);save();render();closeSheet();alert('Imported.');}else alert('Not a valid backup.');}catch(e){alert('Not a valid backup.');}};
  $('#clr').onclick=()=>{if(confirm('Delete every logged day, session and review? This cannot be undone.')){db=normalize({});save();render();closeSheet();}};
  $('#close').onclick=closeSheet;
  $('#sheet').classList.add('open');
}
function closeSheet(){$('#sheet').classList.remove('open');}
$('#sheet').onclick=ev=>{if(ev.target.id==='sheet')closeSheet();};
$('#setBtn').onclick=openSheet;
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();});

// ---------- shell ----------
function render(){
  const weekly=tab==='stats';
  const d=parse(cur);
  $('#dateLabel').innerHTML=weekly?`Wk ${short(weekStart(cur))}<small>${weekStart(cur)===weekStart(today())?'this week':'tap for this week'}</small>`:`${DAYN[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}<small>${cur===today()?'Today':'editing · tap for today'}</small>`;
  $('#nextDay').disabled=weekly?weekStart(cur)>=weekStart(today()):cur>=today();
  $('#brandSub').textContent=({today:'Did I do it today?',work:'Hours are not progress. Outputs are.',gym:trainingLabel(cur),food:'Six meals. Stop at comfortably full.',stats:'Small steps, big changes.'})[tab];
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['today','work','gym','food','stats'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==tab));
  ({today:renderToday,work:renderWork,gym:renderGym,food:renderFood,stats:renderStats})[tab]();
}
$('#prevDay').onclick=()=>{cur=addDays(cur,tab==='stats'?-7:-1);render();};
$('#nextDay').onclick=()=>{const n=addDays(cur,tab==='stats'?7:1);if(n<=today()){cur=n;render();}};
$('#dateLabel').onclick=()=>{cur=today();render();};
$('#dateLabel').onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){cur=today();render();}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(cur>today())cur=today();if(user)pull();render();}});
render();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ready')));
$('#cloudBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .4-9 7 7 0 0 0-13.6 2A4 4 0 0 0 6 19z"/></svg>';
$('#cloudBtn').onclick=openSheet;
window.addEventListener('online',()=>{if(user)pull();});
initAuth();
</script>
</body>
</html>
