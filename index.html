<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baslam Tracker</title>
<meta name="description" content="Daily habit tracker with weekly review and trends.">
<meta name="theme-color" content="#12130F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3EFE6" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baslam">
<script>
  try{var t=localStorage.getItem('baslam-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#12130F; --elev:#1A1C16; --elev-2:#22241D; --line:#32352B; --line-strong:#45483C; --ctrl:#7E8273;
    --text:#F4F1E8; --text-2:#C8C2B4; --text-3:#A9A394;
    --accent:#E0B56A; --accent-press:#C4964E; --on-accent:#1A140C; --accent-soft:#2E2A1F;
    --good:#9BB592; --good-soft:#232A20; --warn:#E0B56A; --warn-soft:#2E2A1F; --danger:#E8A49B;
    --track:#2C2E26; --focus:#A9CFFF;
    --inset:inset 0 1px 0 rgba(255,255,255,.05); --shadow:none;
    --ease-out:cubic-bezier(.2,.8,.2,1); --ease-settle:cubic-bezier(.22,1,.36,1);
    --nav-h:60px; --radius:16px;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#F3EFE6; --elev:#FBFAF6; --elev-2:#FFFFFF; --line:#E3DCD0; --line-strong:#D4CBBC; --ctrl:#9C9385;
    --text:#1A1916; --text-2:#5E594F; --text-3:#7A7468;
    --accent:#8C5E2A; --accent-press:#744C20; --on-accent:#FFFBF5; --accent-soft:#F3E6D4;
    --good:#2F6A3A; --good-soft:#E6EEE3; --warn:#8C5E2A; --warn-soft:#F3E6D4; --danger:#AD302B;
    --track:#E7E0D4; --focus:#175CC4;
    --inset:none; --shadow:0 1px 2px rgba(26,25,22,.05),0 10px 28px rgba(26,25,22,.06);
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{overscroll-behavior:contain}
  body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.5 Outfit,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;transition:background-color .18s,color .18s}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
  button,input,textarea,.habit,.row{transition:background-color .16s var(--ease-out),border-color .16s var(--ease-out),color .16s var(--ease-out),opacity .16s,transform .14s var(--ease-out)}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .serif{font-family:Fraunces,Georgia,serif;font-variation-settings:"opsz" 72;font-weight:600;letter-spacing:-.01em}
  .num{font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

  /* shell */
  .top{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top)}
  .top-in{max-width:560px;margin:0 auto;padding:12px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .date{font-size:26px;line-height:1.1}
  .date small{display:block;font-family:Outfit,sans-serif;font-weight:500;font-size:12.5px;color:var(--text-3);letter-spacing:.02em;margin-top:2px}
  .date small b{color:var(--accent);font-weight:600}
  .tools{display:flex;gap:4px}
  .icon-btn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2)}
  .icon-btn:hover{background:var(--elev-2);color:var(--text)}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn[disabled]{opacity:.3;cursor:default}
  .icon-btn svg{width:20px;height:20px}
  .seg{max-width:560px;margin:0 auto;padding:0 20px 10px;display:none}
  .seg-in{display:flex;background:var(--elev);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--inset)}
  .seg-in button{flex:1;min-height:38px;border-radius:999px;font-weight:500;font-size:14px;color:var(--text-3)}
  .seg-in button.on{background:var(--elev-2);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .bottom{display:none}
  @media (min-width:640px){.seg{display:block}}
  @media (max-width:639px){
    .bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--elev);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
    .bottom button{flex:1;min-height:var(--nav-h);color:var(--text-3);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
    .bottom button.on{color:var(--accent)}
    .bottom svg{width:22px;height:22px}
  }
  main{max-width:560px;margin:0 auto;padding:4px 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
  @media (min-width:640px){main{padding-bottom:48px}}
  section{animation:enter .2s var(--ease-out)}
  @keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hidden{display:none!important}

  /* cards */
  .card{background:var(--elev);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--inset),var(--shadow)}
  .card h2{font-size:17px;margin:0 0 2px}
  .lead{color:var(--text-3);font-size:13.5px;margin:0 0 12px}
  .label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:16px 0 6px}
  .label:first-child{margin-top:0}

  /* hero */
  .hero{display:flex;align-items:center;gap:18px}
  .hero.unlocked{border-color:var(--accent)}
  .ring{width:84px;height:84px;position:relative;flex-shrink:0}
  .ring svg{width:84px;height:84px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:6;stroke-linecap:round}
  .ring .bgc{stroke:var(--track)}
  .ring .fgc{stroke:var(--accent)}
  body.ready .ring .fgc{transition:stroke-dashoffset .64s var(--ease-settle)}
  .ring .cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
  .hero .hm{font-size:12.5px;color:var(--text-3);font-weight:500;margin:0 0 2px}
  .hero .hl{font-size:23px;line-height:1.15;margin:0}
  .hero .hr{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--text-2)}
  .hero .hr svg{width:15px;height:15px;color:var(--text-3)}
  .hero.unlocked .hr{color:var(--accent)} .hero.unlocked .hr svg{color:var(--accent)}

  .chips-row{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap}
  .chip-stat{display:flex;align-items:baseline;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--elev-2);font-size:12.5px;color:var(--text-3);position:relative}
  .chip-stat b{font-size:17px;color:var(--text)}
  .chip-stat.pulse{animation:pulse .7s var(--ease-settle)}
  .chip-stat.pulse::after{content:"";position:absolute;inset:-1px;border-radius:999px;border:1px solid var(--accent);animation:ringout .7s var(--ease-out) forwards}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes ringout{from{opacity:1;inset:-1px}to{opacity:0;inset:-9px}}

  .alert{display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;font-size:14px;background:var(--warn-soft);color:var(--text-2);border:1px solid var(--line)}
  .alert svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;color:var(--accent)}
  .alert b{color:var(--text);display:block;font-weight:600}

  /* habits */
  .list{display:flex;flex-direction:column;gap:8px}
  .habit{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--elev);text-align:left;box-shadow:var(--inset)}
  .habit:hover{border-color:var(--line-strong)}
  .habit:active{transform:scale(.985)}
  .habit.on{background:var(--accent-soft);border-color:var(--accent-soft)}
  .disc{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ctrl);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background-color .16s var(--ease-out),border-color .16s var(--ease-out),transform .22s var(--ease-settle)}
  .disc svg{width:16px;height:16px;fill:none;stroke:var(--on-accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .disc path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s var(--ease-out) .04s}
  .habit.on .disc{background:var(--accent);border-color:var(--accent);animation:pop .22s var(--ease-settle)}
  .habit.on .disc path{stroke-dashoffset:0}
  @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  .htxt{flex:1;min-width:0}
  .htxt b{display:block;font-weight:500;font-size:16px;line-height:1.3}
  .htxt span{display:block;color:var(--text-3);font-size:12.5px;line-height:1.35;margin-top:1px}
  .row{display:flex;align-items:center;gap:12px;min-height:62px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--elev);box-shadow:var(--inset)}
  .row.c{flex-wrap:wrap}
  .row .htxt{flex:1 1 150px}
  .opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .opt{min-height:40px;min-width:44px;padding:0 13px;border-radius:999px;border:1px solid var(--line-strong);font-weight:500;font-size:13.5px;color:var(--text-2)}
  .opt:hover{border-color:var(--ctrl)}
  .opt.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .opt.on.quiet{background:var(--elev-2);border-color:var(--ctrl);color:var(--text)}
  input[type=number],input[type=text],textarea{font:inherit;color:var(--text);background:var(--elev-2);border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;min-height:44px}
  input[type=number]{width:84px;text-align:center;font-weight:600}
  input:hover,textarea:hover{border-color:var(--ctrl)}
  textarea{width:100%;min-height:76px;resize:vertical;line-height:1.5}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:40px;height:40px;border-radius:999px;border:1px solid var(--line-strong);font-size:20px;color:var(--text-2);display:flex;align-items:center;justify-content:center}
  .step button:hover{border-color:var(--ctrl);color:var(--text)}
  .step button:active{transform:scale(.94)}

  /* week */
  .grid{display:grid;grid-template-columns:minmax(96px,1.3fr) repeat(7,1fr);gap:4px;align-items:center;font-size:13px}
  .grid .hd{text-align:center;color:var(--text-3);font-weight:500;font-size:11px;line-height:1.2;padding-bottom:4px}
  .grid .hd em{display:block;font-style:normal;color:var(--text);font-size:13px;font-weight:600}
  .grid .hd.today em{color:var(--accent)}
  .grid .lb{font-weight:500;padding-right:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
  .cell{height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .cell svg{width:15px;height:15px}
  .c-ok{background:var(--accent);color:var(--on-accent)} .c-no{background:var(--elev-2);color:var(--text-3);border:1px solid var(--line)} .c-na{color:var(--line-strong)} .c-bl{background:var(--track);opacity:.6}
  .cell.score{font-weight:600;font-size:12px;color:var(--text-2)}
  .bar{display:flex;align-items:center;gap:12px;min-height:46px;border-bottom:1px solid var(--line)}
  .bar:last-child{border-bottom:0}
  .bar .lb{flex:1;font-weight:500;font-size:14px;color:var(--text-2)}
  .bar .tr{width:110px;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
  .bar .tr i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .5s var(--ease-settle)}
  .bar .val{width:64px;text-align:right;font-weight:600;font-size:14px}
  .bar .val small{color:var(--text-3);font-weight:400}

  .chart{width:100%;height:auto;display:block;margin-top:4px}
  .chart text{font-family:Outfit,sans-serif}

  .sortrow{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line)}
  .sortrow:last-child{border-bottom:0}
  .pill{padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line)}
  .p-keep{color:var(--good);background:var(--good-soft)} .p-fix{color:var(--accent);background:var(--accent-soft)} .p-re{color:var(--danger)} .p-none{color:var(--text-3)}
  label.fl{display:block;font-weight:500;font-size:14.5px;margin:14px 0 6px}
  label.fl small{display:block;color:var(--text-3);font-weight:400;font-size:12.5px}
  .saved{font-size:12px;color:var(--text-3);margin-top:8px;min-height:16px}
  .past{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .past:last-child{border-bottom:0}
  .past b{display:block;font-weight:600}
  .past div{color:var(--text-3);font-size:13px}

  /* sheet */
  .sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
  .sheet.open{display:flex}
  .sheet-in{width:100%;max-width:560px;background:var(--elev);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));animation:up .24s var(--ease-out)}
  @media (min-width:640px){.sheet{align-items:center}.sheet-in{border-radius:22px;margin:20px}}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .sheet h2{font-size:18px;margin:0 0 4px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;color:var(--text)}
  .btn:hover{border-color:var(--ctrl)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .btn.primary:hover{background:var(--accent-press)}
  .btn.danger{color:var(--danger)}
  .btn svg{width:17px;height:17px}
  .muted{color:var(--text-3);font-size:13px}
  #report{display:none}
  .auth{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:var(--bg);padding:20px}
  .auth.open{display:flex}
  .auth-in{width:100%;max-width:380px}
  .auth h1{font-size:30px;margin:0 0 4px}
  .auth p{color:var(--text-3);font-size:14px;margin:0 0 18px}
  .auth input{width:100%;margin-bottom:10px;font-size:16px}
  .auth .btn{width:100%;justify-content:center;margin-bottom:8px}
  .auth .err{color:var(--danger);font-size:13px;min-height:18px;margin:4px 0 8px}
  .auth .skip{display:block;text-align:center;color:var(--text-3);font-size:13px;margin-top:10px;text-decoration:underline;cursor:pointer}
  .cloud{position:relative}
  .cloud::after{content:"";position:absolute;right:9px;bottom:9px;width:8px;height:8px;border-radius:50%;background:var(--text-3)}
  .cloud.synced::after{background:var(--good)} .cloud.syncing::after{background:var(--accent)} .cloud.offline::after{background:var(--danger)} .cloud.local::after{display:none}
  @media print{
    body{background:#fff;color:#111;font-size:12px}
    .top,main,.bottom,.sheet{display:none!important}
    #report{display:block;padding:0;max-width:none}
    #report h1{font-family:Fraunces,Georgia,serif;font-size:24px;margin:0 0 4px}
    #report h2{font-family:Fraunces,Georgia,serif;font-size:16px;margin:18px 0 6px;page-break-after:avoid}
    #report table{width:100%;border-collapse:collapse;font-size:11px;page-break-inside:auto}
    #report th,#report td{border:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top}
    #report th{background:#f2f2f2}
    #report .m{color:#666}
    @page{margin:14mm}
  }
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="date serif" id="dateLabel"></div>
    <div class="tools">
      <button class="icon-btn" id="prevDay" aria-label="Previous"></button>
      <button class="icon-btn" id="nextDay" aria-label="Next"></button>
      <button class="icon-btn cloud local" id="cloudBtn" aria-label="Cloud sync status" title="Not signed in"></button>
      <button class="icon-btn" id="themeBtn" aria-label="Switch theme"></button>
      <button class="icon-btn" id="setBtn" aria-label="Settings and backup"></button>
    </div>
  </div>
  <div class="seg"><div class="seg-in" id="tabsTop"></div></div>
</div>
<main>
  <section id="tab-today"></section>
  <section id="tab-gym" class="hidden"></section>
  <section id="tab-food" class="hidden"></section>
  <section id="tab-trends" class="hidden"></section>
  <section id="tab-review" class="hidden"></section>
</main>
<nav class="bottom" id="tabsBottom" aria-label="Sections"></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetIn"></div></div>
<div id="report"></div>
<div class="auth" id="auth" role="dialog" aria-labelledby="authTitle"><div class="auth-in">
  <h1 class="serif" id="authTitle">Baslam Tracker</h1>
  <p>Sign in so the phone and the Mac share one log. Same email and password on every device.</p>
  <input type="email" id="authEmail" placeholder="Email" autocomplete="email" aria-label="Email">
  <input type="password" id="authPass" placeholder="Password, 8 characters or more" autocomplete="current-password" aria-label="Password">
  <div class="err" id="authErr"></div>
  <button class="btn primary" id="authIn">Sign in</button>
  <button class="btn" id="authUp">Create account</button>
  <span class="skip" id="authSkip">Continue without an account, this device only</span>
</div></div>

<script>
const I={
  check:'<svg viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5l4.2 4.2L19 7.5"/></svg>',
  tick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',

const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const dow=s=>parse(s).getDay();
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmt=s=>{const d=parse(s);return `${DAYN[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;};
const short=s=>{const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]}`;};

// ---------- plan ----------
function blank(){return {clean:null,work:null,train:null,bed:null,wake:null,noFast:null,showerAm:null,showerPm:null,pages:null,mentalist:'none',weight:null,note:''};}
function get(s){return db.entries[s]||null;}
function isLogged(e){return !!e && (e.clean!==null||e.work!==null||e.train!==null||e.bed!==null||e.wake!==null||e.noFast!==null||e.showerAm!==null||e.showerPm!==null||e.pages!==null);}
function trainingRequired(s){const d=dow(s);return d===1||d===3||d===5||d===6;}
function trainingLabel(s){const d=dow(s);return d===6?'Swim day':d===1?'Push day':d===3?'Pull day':d===5?'Legs day':d===0?'Full rest':'Rest day';}
function workRequired(s){const d=dow(s);return d>=1&&d<=5;}
const ITEMS=[
  {key:'clean',label:'Clean day'},{key:'work',label:'Side work'},{key:'train',label:'Training'},
  {key:'sleep',label:'Sleep on time'},{key:'noFast',label:'No fast food'},{key:'shower',label:'Two showers'},{key:'read',label:'Reading'},
];
function evalDay(s){
  const e=get(s)||blank(); const r={};
  r.clean = e.clean===null?'blank':(e.clean?'ok':'no');
  r.work  = !workRequired(s)?'na':(e.work===null?'blank':(e.work>=1?'ok':'no'));
  r.train = !trainingRequired(s)?'na':(e.train===null?'blank':(e.train?'ok':'no'));
  r.sleep = (e.bed===null&&e.wake===null)?'blank':((e.bed&&e.wake)?'ok':'no');
  r.noFast= e.noFast===null?'blank':(e.noFast?'ok':'no');
  r.shower= (e.showerAm===null&&e.showerPm===null)?'blank':((e.showerAm&&e.showerPm)?'ok':'no');
  r.read  = e.pages===null?'blank':(e.pages>=5?'ok':'no');
  const req=ITEMS.filter(i=>r[i.key]!=='na');
  let pts=req.filter(i=>r[i.key]==='ok').length;
  if(e.mentalist==='before') pts=Math.max(0,pts-1);
  return {r,pts,req:req.length,score:req.length?Math.round(100*pts/req.length):0,logged:isLogged(e),e};
}
function rewardUnlocked(s){const v=evalDay(s);const ok=k=>v.r[k]==='ok'||v.r[k]==='na';return ok('work')&&ok('train')&&ok('shower')&&ok('read');}
function streak(pred){
  let s=today(); let n=0;
  if(!isLogged(get(s))) s=addDays(s,-1);
  while(s>=START){const e=get(s); if(!isLogged(e)||!pred(e,s)) break; n++; s=addDays(s,-1);}
  return n;
}
const cleanStreak=()=>streak(x=>x.clean);

function habit(title,sub,val,onChange){
  const b=h(`<button class="habit ${val?'on':''}" role="checkbox" aria-checked="${!!val}"><span class="disc">${I.check}</span><span class="htxt"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span></button>`);

}
function opts(title,sub,list,val,onChange,quiet){
  const row=h(`<div class="row c"><div class="htxt"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</div><div class="opts" role="radiogroup" aria-label="${esc(title)}"></div></div>`);
  list.forEach(([l,v])=>{const c=h(`<button class="opt ${val===v?'on':''} ${quiet&&quiet.includes(v)?'quiet':''}" role="radio" aria-checked="${val===v}">${l}</button>`);c.onclick=()=>onChange(v);row.querySelector('.opts').appendChild(c);});
  return row;
}
function stepper(title,sub,val,step,onChange,ph){
  const row=h(`<div class="row"><div class="htxt"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</div><div class="step"><button aria-label="Less">−</button><input type="number" min="0" step="${step}" value="${val??''}" placeholder="${ph}" aria-label="${esc(title)}"><button aria-label="More">+</button></div></div>`);
  const inp=row.querySelector('input'); const [m,p]=row.querySelectorAll('button');
  inp.onchange=()=>onChange(inp.value===''?null:Number(inp.value));
  m.onclick=()=>onChange(Math.max(0,(Number(inp.value)||0)-step));
  p.onclick=()=>onChange((Number(inp.value)||0)+step);
  return row;
}

const SWIM=[[1,2,'200 m easy · 8 × 50 m moderate, 30 s rest · 100 m easy'],[3,4,'200 m easy · 10 × 50 m moderate, 20 s rest · 100 m easy'],[5,6,'200 m easy · 6 × 100 m moderate, 30 s rest · 100 m easy'],[7,9,'200 m easy · 8 × 100 m, last 25 m fast, 30 s rest · 100 m easy'],[10,12,'300 m easy · 4 × 200 m steady, 45 s rest · 100 m easy']];

const isDeload=s=>{const w=weekNo(s);return w===7||w===12;};

function sessionsFor(k,before){ // logged sessions of exercise k before date, newest first, excluding deloads

function effT(def,sess){ // the weight (or seconds/reps) the session was really done at

// ---------- Week ----------
function weekDays(s){const m=weekStart(s);return [0,1,2,3,4,5,6].map(i=>addDays(m,i));}
function weekTotals(days){
  const t={gym:0,swim:0,work:0,pages:0,bed:0,clean:0,noFast:0,logged:0,score:0,weights:[]};
  days.forEach(s=>{const e=get(s); if(!isLogged(e)) return; t.logged++;
    t.score+=evalDay(s).score;
    if(e.train){ if(dow(s)===6) t.swim++; else t.gym++; }
    t.work+=e.work||0; t.pages+=e.pages||0; if(e.bed) t.bed++; if(e.clean) t.clean++; if(e.noFast) t.noFast++;
    if(e.weight) t.weights.push(e.weight);
  });
  t.avg=t.logged?Math.round(t.score/t.logged):0;
  t.wavg=t.weights.length?Number((t.weights.reduce((a,b)=>a+b,0)/t.weights.length).toFixed(1)):null;
  return t;
}

// ---------- Trends ----------
function bars(vals,labels,max,showVals,goal){
  const W=640,H=180,L=28,B=24,T=14,bw=(W-L-8)/vals.length;
  const y=v=>T+(H-T-B)*(1-Math.min(v,max)/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">`;
  [0,0.5,1].forEach(f=>{s+=`<line x1="${L}" x2="${W-8}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="currentColor" opacity=".1"/><text x="${L-6}" y="${y(max*f)+4}" font-size="10" text-anchor="end" fill="currentColor" opacity=".5">${Math.round(max*f)}</text>`;});
  if(goal) s+=`<line x1="${L}" x2="${W-8}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".8"/>`;
  vals.forEach((v,i)=>{if(v===null)return;const x=L+i*bw;s+=`<rect x="${x+2}" y="${y(v)}" width="${Math.max(2,bw-4)}" height="${H-B-y(v)}" rx="3" fill="var(--accent)" opacity="${v>=(goal||max)?1:.6}"/>`;
    if(showVals) s+=`<text x="${x+bw/2}" y="${y(v)-4}" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">${v}</text>`;});
  labels.forEach((l,i)=>{if(!l)return;s+=`<text x="${L+i*bw+bw/2}" y="${H-7}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".55">${l}</text>`;});
  return s+'</svg>';
}
function renderTrends(){
  const root=$('#tab-trends'); root.innerHTML='';
  renderWeek(root);
  const lifts=EXALL.filter(d=>!d.time&&!d.bw);
  const rows=lifts.map(d=>{const s=sessionsFor(d.k,addDays(today(),1));if(!s.length)return '';const first=effT(d,s[s.length-1]),now=effT(d,s[0]),delta=now-first;return `<div class="bar"><div class="lb">${d.n}</div><div class="val num" style="width:auto">${now} kg <small>${delta>0?'+'+delta+' kg since start':s.length===1?'first session':'no change'}</small></div></div>`;}).join('');
  root.appendChild(h(`<div class="card"><h2 class="serif">Strength</h2><p class="lead">Current working weight per lift. Progress is the number going up, week after week.</p>${rows||'<p class="muted" style="margin:0">No sessions logged yet. Log sets on the Gym tab.</p>'}</div>`));
  const t0=today();
  const days=[];for(let i=27;i>=0;i--)days.push(addDays(t0,-i));
  const sc=days.map(s=>{const v=evalDay(s);return v.logged?v.score:null;});
  const last7=sc.slice(-7).filter(x=>x!==null);
  const avg=last7.length?Math.round(last7.reduce((a,b)=>a+b,0)/last7.length):null;
  root.appendChild(h(`<div class="card"><h2 class="serif">Last 28 days</h2><p class="lead">Day score. Seven-day average <b style="color:var(--text)">${avg===null?'–':avg+'%'}</b>. Watch the average, not a single day. Gaps are days not logged.</p>${bars(sc,days.map((s,i)=>i%7===0?short(s):''),100,false)}</div>`));
  const wk=[];for(let i=5;i>=0;i--)wk.push(weekStart(addDays(t0,-7*i)));
  const wt=wk.map(m=>weekTotals(weekDays(m))); const lbl=wk.map(short);
  root.appendChild(h(`<div class="card"><h2 class="serif">Pages per week</h2><p class="lead">Dashed line is the 70-page target.</p>${bars(wt.map(t=>t.pages),lbl,Math.max(80,...wt.map(t=>t.pages)),true,70)}</div>`));
  root.appendChild(h(`<div class="card"><h2 class="serif">Side work per week</h2><p class="lead">Hours. Dashed line is the 15-hour target.</p>${bars(wt.map(t=>t.work),lbl,Math.max(16,...wt.map(t=>t.work)),true,15)}</div>`));
  root.appendChild(h(`<div class="card"><h2 class="serif">Clean days per week</h2><p class="lead">Out of seven.</p>${bars(wt.map(t=>t.clean),lbl,7,true,7)}</div>`));
  const ws=wt.map(t=>t.wavg);
  if(ws.some(x=>x!==null)) root.appendChild(h(`<div class="card"><h2 class="serif">Weekly average weight</h2><p class="lead">Dashed line is the 65 kg goal.</p>${bars(ws,lbl,70,true,65)}</div>`));
}

// ---------- Review ----------
function renderReview(){
  const root=$('#tab-review'); root.innerHTML='';
  const days=weekDays(cur); const m=days[0];
  const rv=db.reviews[m]||(db.reviews[m]={keep:'',fix:'',focus:''});
  const rates=ITEMS.map(i=>{let ok=0,n=0;days.forEach(s=>{const v=evalDay(s);if(!v.logged||v.r[i.key]==='na')return;n++;if(v.r[i.key]==='ok')ok++;});return {label:i.label,rate:n?Math.round(100*ok/n):null,n};});
  const bucket=r=>r.rate===null?'No data':r.rate>=80?'Keep':r.rate>=40?'Fix':'Rethink';
  const cls=b=>b==='Keep'?'p-keep':b==='Fix'?'p-fix':b==='Rethink'?'p-re':'p-none';
  root.appendChild(h(`<div class="card"><h2 class="serif">Habit sorting</h2><p class="lead">Week of ${short(m)}. Keep at 80 % or more. Fix between 40 and 80 %: change the trigger, not the goal. Rethink under 40 % two weeks running.</p>
    ${rates.map(r=>`<div class="sortrow"><div class="htxt"><b>${r.label}</b><span>${r.rate===null?'nothing logged':r.rate+' % of '+r.n+' days'}</span></div><span class="pill ${cls(bucket(r))}">${bucket(r)}</span></div>`).join('')}</div>`));
  const f=h(`<div class="card"><h2 class="serif">Sunday review</h2><p class="lead">Ten minutes. Saved as you type.</p>
    <label class="fl" for="rk">Keep<small>What worked this week?</small></label><textarea id="rk" data-k="keep"></textarea>
    <label class="fl" for="rf">Fix<small>What kept failing, and the one trigger you will change.</small></label><textarea id="rf" data-k="fix"></textarea>
    <label class="fl" for="ro">Focus<small>One item for next week.</small></label><input id="ro" type="text" data-k="focus" style="width:100%">
    <div class="saved" id="savedMsg"></div>
  </div>`);
  let tmr;
  f.querySelectorAll('[data-k]').forEach(el=>{el.value=rv[el.dataset.k]||'';el.oninput=()=>{rv[el.dataset.k]=el.value;clearTimeout(tmr);tmr=setTimeout(()=>{save();const s=$('#savedMsg');if(s)s.textContent=saveFailed?'Not saved. Storage is blocked.':'Saved';},400);};el.onblur=()=>{save();};});
  root.appendChild(f);
  const past=Object.keys(db.reviews).filter(k=>k!==m&&(db.reviews[k].keep||db.reviews[k].fix||db.reviews[k].focus)).sort().reverse();
  if(past.length) root.appendChild(h(`<div class="card"><h2 class="serif">Past reviews</h2>${past.map(k=>`<div class="past"><b>Week of ${short(k)}</b><div>Keep: ${esc(db.reviews[k].keep||'–')}</div><div>Fix: ${esc(db.reviews[k].fix||'–')}</div><div>Focus: ${esc(db.reviews[k].focus||'–')}</div></div>`).join('')}</div>`));
}

// ---------- Progress report (print to PDF) ----------
function buildReport(){
  const t0=today(); const from=START<t0?START:t0;
  const weeks=[]; for(let m=weekStart(from); m<=t0; m=addDays(m,7)) weeks.push(m);
  const ok=v=>v==='ok'?'✓':v==='no'?'✗':v==='na'?'–':'';
  let html=`<h1>Baslam Tracker · Progress report</h1><p class="m">Generated ${fmt(t0)} 2026 · Programme from ${fmt(START)} · ${Object.keys(db.entries).filter(k=>isLogged(db.entries[k])).length} days logged · Clean-day streak ${cleanStreak()}</p>`;
  html+=`<h2>Weekly summary</h2><table><tr><th>Week of</th><th>Logged</th><th>Avg score</th><th>Clean</th><th>No fast food</th><th>Bed 23:00</th><th>Gym</th><th>Swim</th><th>Work h</th><th>Pages</th><th>5+ meals</th><th>Heat</th><th>Weight</th></tr>`;
  weeks.forEach(m=>{const t=weekTotals(weekDays(m));t.meals=weekDays(m).filter(s=>mealCount(s)>=5).length;t.heat=weekDays(m).filter(s=>recTotal(db.workouts[s])>0).length;
    html+=`<tr><td>${short(m)}</td><td>${t.logged}/7</td><td>${t.avg}%</td><td>${t.clean}</td><td>${t.noFast}</td><td>${t.bed}</td><td>${t.gym}/3</td><td>${t.swim}/1</td><td>${t.work}/15</td><td>${t.pages}/70</td><td>${t.meals}</td><td>${t.heat}/3</td><td>${t.wavg?t.wavg+' kg':''}</td></tr>`;});
  html+=`</table>`;
  html+=`<h2>Strength</h2><table><tr><th>Lift</th><th>First</th><th>Now</th><th>Change</th><th>Sessions</th></tr>`;
  EXALL.filter(d=>!d.time&&!d.bw).forEach(d=>{const s=sessionsFor(d.k,addDays(t0,1));if(!s.length)return;const f=effT(d,s[s.length-1]),n=effT(d,s[0]);html+=`<tr><td>${d.n}</td><td>${f} kg</td><td>${n} kg</td><td>${n-f>=0?'+':''}${n-f} kg</td><td>${s.length}</td></tr>`;});
  html+=`</table>`;
  html+=`<h2>Day by day</h2><table><tr><th>Date</th><th>Score</th>${ITEMS.map(i=>`<th>${i.label}</th>`).join('')}<th>Work</th><th>Pages</th><th>Meals</th><th>Weight</th><th>Note</th></tr>`;
  Object.keys(db.entries).filter(k=>isLogged(db.entries[k])&&k<=t0).sort().forEach(s=>{const v=evalDay(s);const e=v.e;html+=`<tr><td>${short(s)}</td><td>${v.score}%</td>${ITEMS.map(i=>`<td>${ok(v.r[i.key])}</td>`).join('')}<td>${e.work??''}</td><td>${e.pages??''}</td><td>${mealCount(s)||''}</td><td>${e.weight??''}</td><td>${esc(e.note||'')}</td></tr>`;});
  html+=`</table>`;
  const ws=Object.keys(db.workouts).filter(k=>k<=t0&&db.workouts[k].ex&&Object.values(db.workouts[k].ex).some(x=>x.sets.some(y=>y.r>0))).sort();
  if(ws.length){html+=`<h2>Gym sessions</h2><table><tr><th>Date</th><th>Session</th><th>Sets logged (weight × reps)</th><th>Heat min</th></tr>`;
    ws.forEach(s=>{const w=db.workouts[s];const parts=Object.keys(w.ex).filter(k=>w.ex[k].sets.some(y=>y.r>0)).map(k=>{const d=L[k]||{n:k};return `${d.n}: ${w.ex[k].sets.filter(y=>y.r>0).map(y=>(y.w!=null?y.w+'×':'')+y.r).join(', ')}`;});html+=`<tr><td>${short(s)}</td><td>${SESSION[w.type]||w.type}${w.deload?' (deload)':''}</td><td>${parts.join(' · ')}</td><td>${recTotal(w)||''}</td></tr>`;});
    html+=`</table>`;}
  const rv=Object.keys(db.reviews).filter(k=>db.reviews[k].keep||db.reviews[k].fix||db.reviews[k].focus).sort();
  if(rv.length){html+=`<h2>Sunday reviews</h2><table><tr><th>Week of</th><th>Keep</th><th>Fix</th><th>Focus</th></tr>`;rv.forEach(k=>{const r=db.reviews[k];html+=`<tr><td>${short(k)}</td><td>${esc(r.keep)}</td><td>${esc(r.fix)}</td><td>${esc(r.focus)}</td></tr>`;});html+=`</table>`;}
  html+=`<h2>Backup data</h2><p class="m" style="font-family:monospace;font-size:8px;word-break:break-all">${esc(JSON.stringify(db))}</p>`;
  $('#report').innerHTML=html;
}
function printReport(){buildReport();closeSheet();setTimeout(()=>window.print(),150);}

// ---------- Settings sheet ----------
function openSheet(){
  const n=Object.keys(db.entries).filter(k=>isLogged(db.entries[k])).length;
  const s=$('#sheetIn'); s.innerHTML='';
  s.appendChild(h(`<div><h2 class="serif" id="sheetTitle">Settings</h2>
    <p class="lead">${user?`Signed in as ${esc(user.email)}. ${syncState==='synced'?'Everything is synced to the cloud.':syncState==='offline'?'Offline right now, saved on this device and pushed when back online.':'Syncing.'}`:'Not signed in. Data lives in this browser only.'}</p>
    <div class="btns" style="margin-top:0;margin-bottom:14px">${user?`<button class="btn" id="signout">Sign out</button>`:`<button class="btn primary" id="signin">Sign in or create account</button>`}</div>
    <h2 class="serif">Backup</h2><p class="lead">${n} day${n===1?'':'s'} logged. Copy a backup now and then and keep it in a note. Paste it on another device and press Import.</p>
    <textarea id="bak" aria-label="Backup text" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;min-height:64px" placeholder="Backup text appears here. Paste a backup here to import."></textarea>
    <div class="btns"><button class="btn primary" id="exp">${I.copy} Copy backup</button><button class="btn" id="imp">${I.upload} Import</button><button class="btn danger" id="clr">${I.trash} Clear all</button></div>
    <h2 class="serif" style="margin-top:18px">Progress report</h2><p class="lead">Every week, every lift, every day and your reviews in one document. Opens the print dialog: choose Save as PDF, then share it.</p>
    <div class="btns"><button class="btn primary" id="rep">${I.review} Make PDF report</button><button class="btn" id="close">Close</button></div></div>`));
  $('#rep').onclick=printReport;
  if($('#signout'))$('#signout').onclick=signOut;
  if($('#signin'))$('#signin').onclick=()=>{closeSheet();showAuth(true);};
  const bak=$('#bak');
  $('#exp').onclick=()=>{bak.value=JSON.stringify(db);bak.select();try{navigator.clipboard.writeText(bak.value);alert('Backup copied to clipboard.');}catch(e){alert('Backup shown in the box. Select and copy it.');}};
  $('#imp').onclick=()=>{try{const d=JSON.parse(bak.value);if(d&&d.entries){db={entries:d.entries,reviews:d.reviews||{},milestones:d.milestones||[],workouts:d.workouts||{},meals:d.meals||{}};save();render();closeSheet();alert('Imported.');}else alert('Not a valid backup.');}catch(e){alert('Not a valid backup.');}};
  $('#clr').onclick=()=>{if(confirm('Delete every logged day and review? This cannot be undone.')){db={entries:{},reviews:{},milestones:[],workouts:{},meals:{}};save();render();closeSheet();}};
  $('#close').onclick=closeSheet;
  $('#sheet').classList.add('open');
}
function closeSheet(){$('#sheet').classList.remove('open');}
$('#sheet').onclick=ev=>{if(ev.target.id==='sheet')closeSheet();};
$('#setBtn').onclick=openSheet;
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();});

// ---------- shell ----------
function render(){
  const weekly=tab==='trends'||tab==='review';
  const d=parse(cur);
  $('#dateLabel').innerHTML=weekly?`Week of ${short(weekStart(cur))}<small>${weekStart(cur)===weekStart(today())?'this week':'<b>tap for this week</b>'}</small>`:`${DAYN[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}<small>${cur===today()?'Today':'<b>Editing. Tap for today</b>'}</small>`;
  $('#nextDay').disabled=weekly?weekStart(cur)>=weekStart(today()):cur>=today();
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['today','gym','food','trends','review'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==tab));
  ({today:renderToday,gym:renderGym,food:renderFood,trends:renderTrends,review:renderReview})[tab]();
}
$('#prevDay').onclick=()=>{cur=addDays(cur,(tab==='trends'||tab==='review')?-7:-1);render();};
$('#nextDay').onclick=()=>{const n=addDays(cur,(tab==='trends'||tab==='review')?7:1);if(n<=today()){cur=n;render();}};
$('#dateLabel').onclick=()=>{cur=today();render();};
$('#dateLabel').style.cursor='pointer';
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cur>today())render();});
render();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ready')));
$('#cloudBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .4-9 7 7 0 0 0-13.6 2A4 4 0 0 0 6 19z"/></svg>';
$('#cloudBtn').onclick=openSheet;
window.addEventListener('online',()=>{if(user)pull();});
initAuth();
</script>
</body>
</html>
