<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baslam Tracker</title>
<meta name="description" content="Daily habit, work, gym and food tracker with weekly review and trends.">
<meta name="theme-color" content="#0A0B0A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F5F0" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baslam">
<script>
  try{var t=localStorage.getItem('baslam-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0A0B0A; --bg-2:#111311; --card:#151715; --card-2:#1C1F1C; --line:#262A26; --line-2:#343934; --ctrl:#5C645C;
    --text:#F3F5EF; --text-2:#B9BEB5; --text-3:#7F867E;
    --accent:#C6F135; --accent-2:#A9D61D; --on-accent:#0B0F06; --accent-soft:rgba(198,241,53,.12); --accent-glow:rgba(198,241,53,.22);
    --blue:#5EC8F5; --orange:#F59E42;
    --warn:#F59E42; --warn-soft:rgba(245,158,66,.14); --danger:#F0665A; --danger-soft:rgba(240,102,90,.14);
    --track:#242824; --focus:#8FD3FF;
    --edge:inset 0 1px 0 rgba(255,255,255,.05); --shadow:0 8px 28px rgba(0,0,0,.35);
    --btn-shadow:0 2px 0 rgba(0,0,0,.55),0 10px 24px rgba(0,0,0,.35);
    --ease-out:cubic-bezier(.2,.8,.2,1); --ease-settle:cubic-bezier(.22,1,.36,1);
    --nav-h:64px; --r:18px; --side:224px;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#F4F5F0; --bg-2:#ECEEE7; --card:#FFFFFF; --card-2:#F2F4EC; --line:#E1E4DA; --line-2:#CFD4C6; --ctrl:#9AA193;
    --text:#111411; --text-2:#4E554C; --text-3:#767D74;
    --accent:#6F9A00; --accent-2:#5C8200; --on-accent:#FFFFFF; --accent-soft:rgba(111,154,0,.12); --accent-glow:rgba(111,154,0,.18);
    --blue:#1E8FC8; --orange:#C26A12;
    --warn:#C26A12; --warn-soft:rgba(194,106,18,.12); --danger:#C2362B; --danger-soft:rgba(194,54,43,.12);
    --track:#E3E6DC; --focus:#1D6FD8;
    --edge:none; --shadow:0 1px 2px rgba(17,20,17,.05),0 10px 28px rgba(17,20,17,.07);
    --btn-shadow:0 2px 0 rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.08);
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{overscroll-behavior:contain}
  body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:14.5px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;transition:background-color .18s,color .18s}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 360px at 60% -120px,var(--accent-glow),transparent 70%);opacity:.8;z-index:0}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
  button,input,textarea,.habit,.row,.tile,.nav a{transition:background-color .16s var(--ease-out),border-color .16s var(--ease-out),color .16s var(--ease-out),opacity .16s,transform .14s var(--ease-out),box-shadow .14s}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .disp{font-family:Sora,Inter,sans-serif;font-weight:700;letter-spacing:-.03em}
  .num{font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

  /* app frame */
  .app{position:relative;z-index:1;display:grid;grid-template-columns:1fr;min-height:100dvh}
  .side{display:none}
  @media (min-width:900px){
    .app{grid-template-columns:var(--side) 1fr}
    .side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);background:color-mix(in srgb,var(--card) 70%,var(--bg));padding:18px 14px;gap:6px}
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:var(--on-accent);box-shadow:0 6px 18px var(--accent-glow);flex-shrink:0}
  .logo svg{width:20px;height:20px}
  .brand b{font-family:Sora,sans-serif;font-weight:700;font-size:17px;letter-spacing:-.02em;display:block;line-height:1.1}
  .brand small{display:block;color:var(--text-3);font-size:11.5px;font-weight:500}
  .nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--text-2);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
  .nav a svg{width:18px;height:18px;color:var(--text-3)}
  .nav a:hover{background:var(--card-2);color:var(--text)}
  .nav a.on{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 16px var(--accent-glow)} .nav a.on svg{color:var(--on-accent)}
  .side .grow{flex:1}
  .side .foot{border-top:1px solid var(--line);padding-top:10px}
  .side .user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-top:6px}
  .side .user .av{width:30px;height:30px;border-radius:50%;background:var(--card-2);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;font-size:12px;color:var(--accent);flex-shrink:0}
  .side .user b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
  .side .user small{display:block;color:var(--text-3);font-size:11px}

  .top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
  .top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .top .brand{padding:0}
  @media (min-width:900px){.top .brand{display:none}.top .title{display:block}}
  .title{display:none}
  .title h1{font-family:Sora,sans-serif;font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.1}
  .title p{margin:2px 0 0;color:var(--text-3);font-size:12.5px}
  .tools{display:flex;gap:6px;align-items:center}
  .icon-btn{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);background:var(--card);border:1px solid var(--line);box-shadow:var(--edge)}
  .icon-btn:hover{border-color:var(--line-2);color:var(--text)}
  .icon-btn:active{transform:translateY(1px)}
  .icon-btn[disabled]{opacity:.3;cursor:default}
  .icon-btn svg{width:19px;height:19px}
  .datepill{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;box-shadow:var(--edge)}
  .datepill .icon-btn{border:0;background:none;width:36px;height:36px;box-shadow:none}
  .datelbl{min-width:112px;text-align:center;font-family:Sora,sans-serif;font-weight:700;font-size:14px;letter-spacing:-.01em;cursor:pointer;line-height:1.1;padding:0 4px}
  .datelbl small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:10.5px;color:var(--accent)}
  .bottom{display:none}
  @media (max-width:899px){
    .bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:0 6px env(safe-area-inset-bottom)}
    .bottom button{flex:1;min-height:var(--nav-h);color:var(--text-3);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
    .bottom button.on{color:var(--accent)}
    .bottom button svg{width:22px;height:22px}
    .bottom .plus{flex:0 0 72px}
    .bottom .plus span{width:56px;height:56px;border-radius:50%;background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--on-accent);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 10px 26px var(--accent-glow),0 2px 0 rgba(0,0,0,.4);border:4px solid var(--bg)}
    .bottom .plus span svg{width:26px;height:26px}
  }
  main{max-width:1180px;margin:0 auto;padding:16px 20px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom));width:100%}
  @media (min-width:900px){main{padding:18px 24px 60px}}
  section{animation:enter .22s var(--ease-out)}
  @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hidden{display:none!important}

  /* grid system */
  .g{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:start}
  .g>*{grid-column:span 12;min-width:0}
  @media (min-width:900px){.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}}
  .stack{display:flex;flex-direction:column;gap:14px;min-width:0}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--edge),var(--shadow);min-width:0}
  .card h2{font-family:Sora,sans-serif;font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
  .lead{color:var(--text-3);font-size:12.5px;margin:2px 0 12px;line-height:1.45}
  .label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);margin:14px 0 8px}
  .label:first-child{margin-top:0}
  .h-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}

  /* kpi tiles */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--edge),var(--shadow);display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;min-width:0}
  .kpi .t{font-size:12px;color:var(--text-3);font-weight:600;display:flex;align-items:center;gap:6px;grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .t svg{width:14px;height:14px;flex-shrink:0}
  .kpi .v{font-size:28px;line-height:1;display:flex;align-items:baseline;gap:4px;white-space:nowrap}
  .kpi .v small{font-size:12px;color:var(--text-3);font-weight:600;font-family:Inter,sans-serif;letter-spacing:0}
  .kpi canvas{width:92px!important;height:38px!important}
  .delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:var(--card-2);color:var(--text-3);white-space:nowrap;grid-column:1/-1;justify-self:start}
  .delta.up{color:var(--accent);background:var(--accent-soft)} .delta.down{color:var(--danger);background:var(--danger-soft)}
  .delta svg{width:11px;height:11px}
  .kpi.pulse{animation:pulse .7s var(--ease-settle)}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
  .big{font-size:40px;line-height:1}
  .big small{font-size:14px;color:var(--text-3);font-family:Inter,sans-serif;font-weight:600;letter-spacing:0;margin-left:4px}

  /* hero */
  .hero{display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--accent-glow),transparent 65%);pointer-events:none}
  .hero.unlocked{border-color:var(--accent)}
  .ring{width:96px;height:96px;position:relative;flex-shrink:0}
  .ring svg{width:96px;height:96px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:7;stroke-linecap:round}
  .ring .bgc{stroke:var(--track)} .ring .fgc{stroke:var(--accent);filter:drop-shadow(0 0 6px var(--accent-glow))}
  body.ready .ring .fgc{transition:stroke-dashoffset .64s var(--ease-settle)}
  .ring .cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
  .hero .hm{font-size:11px;color:var(--text-3);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
  .hero .hl{font-size:26px;line-height:1.1;margin:0}
  .hero .hr{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--text-2)}
  .hero .hr svg{width:15px;height:15px;color:var(--text-3)}
  .hero.unlocked .hr,.hero.unlocked .hr svg{color:var(--accent)}

  .alert{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px;font-size:13px;background:var(--warn-soft);color:var(--text-2);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
  .alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;color:var(--warn)}
  .alert b{color:var(--text);display:block;font-weight:700}
  .alert.ok{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)} .alert.ok svg{color:var(--accent)}

  /* habits and rows */
  .list{display:flex;flex-direction:column;gap:8px}
  .habit{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card-2);text-align:left;box-shadow:var(--edge)}
  .habit:hover{border-color:var(--line-2)}
  .habit:active{transform:scale(.985)}
  .habit.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
  .disc{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ctrl);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background-color .16s var(--ease-out),border-color .16s var(--ease-out),transform .22s var(--ease-settle)}
  .disc svg{width:15px;height:15px;fill:none;stroke:var(--on-accent);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  .disc path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s var(--ease-out) .04s}
  .habit.on .disc,.goal.on .disc{background:var(--accent);border-color:var(--accent);animation:pop .22s var(--ease-settle);box-shadow:0 0 0 4px var(--accent-soft)}
  .habit.on .disc path,.goal.on .disc path{stroke-dashoffset:0}
  @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  .htxt{flex:1;min-width:0}
  .htxt b{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
  .htxt span{display:block;color:var(--text-3);font-size:12px;line-height:1.35;margin-top:1px}
  .row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card-2);box-shadow:var(--edge)}
  .row.c{flex-wrap:wrap}
  .row .htxt{flex:1 1 150px}
  .opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .opt{min-height:36px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:12.5px;color:var(--text-2);box-shadow:var(--edge);display:inline-flex;align-items:center;gap:6px}
  .opt:hover{border-color:var(--ctrl);color:var(--text)}
  .opt:active{transform:translateY(1px)}
  .opt.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 12px var(--accent-glow)}
  .opt.on.quiet{background:var(--card);border-color:var(--ctrl);color:var(--text);box-shadow:var(--edge)}
  .opt .dot{width:8px;height:8px;border-radius:50%}
  input[type=number],input[type=text],input[type=email],input[type=password],textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;min-height:42px;box-shadow:var(--edge)}
  input[type=number]{width:80px;text-align:center;font-weight:700;font-family:Sora,sans-serif}
  input:hover,textarea:hover{border-color:var(--ctrl)}
  textarea{width:100%;min-height:70px;resize:vertical;line-height:1.5}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:38px;height:38px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:20px;font-weight:600;color:var(--text-2);display:flex;align-items:center;justify-content:center;box-shadow:var(--edge)}
  .step button:hover{border-color:var(--ctrl);color:var(--text)}
  .step button:active{transform:translateY(1px)}

  /* time control */
  .tc{display:flex;flex-direction:column;gap:8px;min-width:0}
  .tc .lab{font-size:10.5px;font-weight:700;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}
  .tc .face{display:flex;align-items:center;gap:6px}
  .tc .face button{width:40px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);color:var(--text-2);font-weight:700;font-size:12px;box-shadow:var(--edge);flex-shrink:0}
  .tc .face button:active{transform:translateY(1px)}
  .tc .face input{flex:1;min-width:0;width:100%;text-align:center;font-family:Sora,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em;padding:6px 8px;min-height:44px;background:var(--card);border:1px solid var(--line-2);border-radius:12px;color:var(--text)}
  .tc .face input::placeholder{color:var(--text-3);font-size:16px}
  .tc .presets{display:flex;gap:6px;flex-wrap:wrap}
  .tc .presets .opt{min-height:30px;padding:0 10px;font-size:12px}

  /* buttons */
  .btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:linear-gradient(180deg,var(--card-2),var(--card));font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--text);box-shadow:var(--btn-shadow),var(--edge);font-family:Sora,sans-serif;letter-spacing:-.01em;white-space:nowrap}
  .btn:hover{border-color:var(--ctrl)}
  .btn:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,0),var(--edge)}
  .btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));border-color:var(--accent-2);color:var(--on-accent);box-shadow:0 2px 0 rgba(0,0,0,.4),0 12px 28px var(--accent-glow)}
  .btn.danger{color:var(--danger)}
  .btn.sm{min-height:36px;padding:0 14px;font-size:12.5px}
  .btn svg{width:17px;height:17px}
  .btn.block{width:100%}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .seg{display:inline-flex;background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
  .seg button{min-height:32px;padding:0 13px;border-radius:999px;font-weight:600;font-size:12.5px;color:var(--text-3);white-space:nowrap}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--text);color:var(--bg)}

  /* tables */
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:700;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
  .tbl td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:0}
  .tbl td.r,.tbl th.r{text-align:right}
  .tbl input[type=number]{width:70px;min-height:38px;padding:6px}
  .tbl .tick{width:36px;height:36px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--text-3)}
  .tbl .tick svg{width:15px;height:15px}

function workRequired(s){const d=dow(s);return d>=1&&d<=5;}

function sideHours(s){return (db.work.sessions[s]||[]).filter(x=>x.b!=='remak').reduce((a,x)=>a+sessH(x),0);}
function skipFor(s){if(!db.work.skip[s])db.work.skip[s]={};return db.work.skip[s];}
function workVal(s){const e=get(s);const h=sideHours(s);if(h>0)return h;const sk=db.work.skip[s];if(sk&&(sk.vts||sk.salma))return 0;return e?e.work:null;}
function evalDay(s){
  const e=get(s)||blank(); const r={}; const wv=workVal(s);
  r.clean = e.clean===null?'blank':(e.clean?'ok':'no');
  r.work  = !workRequired(s)?'na':(wv===null?'blank':(wv>=1?'ok':'no'));
  r.train = !trainingRequired(s)?'na':(e.train===null?'blank':(e.train?'ok':'no'));
  r.sleep = (e.bed===null&&e.wake===null)?'blank':((e.bed&&e.wake)?'ok':'no');
  r.noFast= e.noFast===null?'blank':(e.noFast?'ok':'no');
  r.shower= (e.showerAm===null&&e.showerPm===null)?'blank':((e.showerAm&&e.showerPm)?'ok':'no');
  r.read  = e.pages===null?'blank':(e.pages>=5?'ok':'no');
  const req=ITEMS.filter(i=>r[i.key]!=='na');
  let pts=req.filter(i=>r[i.key]==='ok').length;
  if(e.mentalist==='before') pts=Math.max(0,pts-1);
  const logged=isLogged(e)||sideHours(s)>0;
  return {r,pts,req:req.length,score:req.length?Math.round(100*pts/req.length):0,logged,e};
}

function weekDays(s){const m=weekStart(s);return [0,1,2,3,4,5,6].map(i=>addDays(m,i));}
function weekTotals(days){const t={gym:0,swim:0,work:0,pages:0,bed:0,clean:0,noFast:0,logged:0,score:0,weights:[],meals:0,heat:0};days.forEach(s=>{const v=evalDay(s);const e=v.e;t.work+=workVal(s)||0;if(mealCount(s)>=5)t.meals++;if(recTotal(db.workouts[s])>0)t.heat++;if(!v.logged)return;t.logged++;t.score+=v.score;if(e.train){if(dow(s)===6)t.swim++;else t.gym++;}t.pages+=e.pages||0;if(e.bed)t.bed++;if(e.clean)t.clean++;if(e.noFast)t.noFast++;if(e.weight)t.weights.push(e.weight);});t.work=Math.round(t.work*100)/100;t.avg=t.logged?Math.round(t.score/t.logged):0;t.wavg=t.weights.length?Number((t.weights.reduce((a,b)=>a+b,0)/t.weights.length).toFixed(1)):null;return t;}
function rangeDays(n,end){const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(end,-i));return a;}
function periodTotals(days){const t={score:0,logged:0,clean:0,pages:0,work:0,vts:0,salma:0,remak:0,gym:0,weights:[],meals:0};days.forEach(s=>{const v=evalDay(s);if(v.logged){t.logged++;t.score+=v.score;if(v.e.clean)t.clean++;t.pages+=v.e.pages||0;if(v.e.train&&dow(s)!==6)t.gym++;if(v.e.weight)t.weights.push(v.e.weight);}t.work+=workVal(s)||0;if(mealCount(s)>=5)t.meals++;});t.vts=bizHours('vts',days);t.salma=bizHours('salma',days);t.remak=bizHours('remak',days);t.avg=t.logged?Math.round(t.score/t.logged):0;t.wavg=t.weights.length?Number((t.weights.reduce((a,b)=>a+b,0)/t.weights.length).toFixed(1)):null;return t;}

function buildReport(){
  const t0=today(); const from=START<t0?START:t0;
  const weeks=[]; for(let m=weekStart(from); m<=t0; m=addDays(m,7)) weeks.push(m);
  const ok=v=>v==='ok'?'✓':v==='no'?'✗':v==='na'?'–':'';
  let html=`<h1>Baslam · Progress report</h1><p class="m">Generated ${fmt(t0)} · Programme from ${fmt(START)} · Clean-day streak ${cleanStreak()}</p>`;
  html+=`<h2>Weekly summary</h2><table><tr><th>Week of</th><th>Logged</th><th>Avg score</th><th>Clean</th><th>Bed 23:00</th><th>Gym</th><th>Swim</th><th>VTS h</th><th>Salma h</th><th>Remak h</th><th>Pages</th><th>5+ meals</th><th>Weight</th></tr>`;
  weeks.forEach(m=>{const d=weekDays(m);const t=weekTotals(d);html+=`<tr><td>${short(m)}</td><td>${t.logged}/7</td><td>${t.avg}%</td><td>${t.clean}</td><td>${t.bed}</td><td>${t.gym}/3</td><td>${t.swim}/1</td><td>${fmtH(bizHours('vts',d))}</td><td>${fmtH(bizHours('salma',d))}</td><td>${fmtH(bizHours('remak',d))}</td><td>${t.pages}/70</td><td>${t.meals}</td><td>${t.wavg?t.wavg+' kg':''}</td></tr>`;});
  html+=`</table><h2>Work sessions</h2><table><tr><th>Date</th><th>Business</th><th>Time</th><th>Category</th><th>What moved</th></tr>`;

  html+=`</table><h2>Missed side work</h2><table><tr><th>Date</th><th>Business</th><th>Reason</th></tr>`;

  html+=`</table><h2>Weekly goals</h2><table><tr><th>Week of</th><th>Business</th><th>Goal</th><th>Done</th></tr>`;
  Object.keys(db.work.goals).sort().forEach(m=>['vts','salma','remak'].forEach(b=>(db.work.goals[m][b]||[]).forEach(gl=>{if(gl.t)html+=`<tr><td>${short(m)}</td><td>${BIZ[b].n}</td><td>${esc(gl.t)}</td><td>${gl.done?'✓':''}</td></tr>`;})));
  html+=`</table><h2>Strength</h2><table><tr><th>Lift</th><th>First</th><th>Now</th><th>Change</th><th>Sessions</th></tr>`;
  EXALL.filter(d=>!d.time&&!d.bw).forEach(d=>{const s=gymSessionsFor(d.k,addDays(t0,1));if(!s.length)return;const f=effT(d,s[s.length-1]),n=effT(d,s[0]);html+=`<tr><td>${d.n}</td><td>${f} kg</td><td>${n} kg</td><td>${n-f>=0?'+':''}${n-f} kg</td><td>${s.length}</td></tr>`;});
  html+=`</table><h2>Day by day</h2><table><tr><th>Date</th><th>Score</th>${ITEMS.map(i=>`<th>${i.label}</th>`).join('')}<th>Pages</th><th>Meals</th><th>Weight</th><th>Note</th></tr>`;
  Object.keys(db.entries).filter(k=>evalDay(k).logged&&k<=t0).sort().forEach(s=>{const v=evalDay(s);const e=v.e;html+=`<tr><td>${short(s)}</td><td>${v.score}%</td>${ITEMS.map(i=>`<td>${ok(v.r[i.key])}</td>`).join('')}<td>${e.pages??''}</td><td>${mealCount(s)||''}</td><td>${e.weight??''}</td><td>${esc(e.note||'')}</td></tr>`;});
  html+=`</table>`;
  const rv=Object.keys(db.reviews).filter(k=>db.reviews[k].keep||db.reviews[k].fix||db.reviews[k].focus).sort();

  html+=`<h2>Backup data</h2><p class="m" style="font-family:monospace;font-size:7px;word-break:break-all">${esc(JSON.stringify(db))}</p>`;
  $('#report').innerHTML=html;
}

function openQuick(){
  const s=$('#sheetIn'); s.innerHTML='';
  s.appendChild(h(`<div><h2>Quick log</h2><p class="lead">What do you want to log?</p><div class="quick">
    <button class="btn primary" data-go="work">${I.work}Work session</button><button class="btn" data-go="work">${I.clock}Remak in / out</button>
    <button class="btn" data-go="food">${I.food}Meals</button><button class="btn" data-go="gym">${I.gym}Gym sets</button>
    <button class="btn" data-go="today">${I.scale}Weight</button><button class="btn" data-go="stats">${I.stats}Stats and review</button></div>
    <div class="btns"><button class="btn block" id="qClose">Close</button></div></div>`));
  s.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closeSheet();switchTab(b.dataset.go);});
  s.querySelector('#qClose').onclick=closeSheet;
  $('#sheet').classList.add('open');
}
function openSheet(){
  const n=Object.keys(db.entries).filter(k=>evalDay(k).logged).length;
  const s=$('#sheetIn'); s.innerHTML='';
  s.appendChild(h(`<div><h2>Settings</h2>
    <p class="lead">${user?`Signed in as ${esc(user.email)}. ${syncState==='synced'?'Everything is synced.':syncState==='offline'?'Offline right now, saved on this device and pushed when back online.':'Syncing.'}`:'Not signed in. Data lives in this browser only.'}</p>
    <div class="btns" style="margin-top:0;margin-bottom:14px">${user?`<button class="btn" id="signout">Sign out</button>`:`<button class="btn primary" id="signin">Sign in or create account</button>`}</div>
    <h2>Backup</h2><p class="lead">${n} day${n===1?'':'s'} logged. Copy a backup now and then and keep it in a note.</p>
    <textarea id="bak" aria-label="Backup text" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;min-height:60px" placeholder="Backup text appears here. Paste a backup here to import."></textarea>
    <div class="btns"><button class="btn primary" id="exp">${I.copy} Copy backup</button><button class="btn" id="imp">${I.upload} Import</button><button class="btn danger" id="clr">${I.trash} Clear all</button></div>
    <h2 style="margin-top:18px">Progress report</h2><p class="lead">Every week, every session, every lift, every day and your reviews in one document. Save as PDF and share it.</p>
    <div class="btns"><button class="btn primary" id="rep">${I.doc} Make PDF report</button><button class="btn" id="close">Close</button></div></div>`));
  $('#rep').onclick=printReport;
  if($('#signout'))$('#signout').onclick=signOut;
  if($('#signin'))$('#signin').onclick=()=>{closeSheet();showAuth(true);};
  const bak=$('#bak');
  $('#exp').onclick=()=>{bak.value=JSON.stringify(db);bak.select();try{navigator.clipboard.writeText(bak.value);alert('Backup copied to clipboard.');}catch(e){alert('Backup shown in the box. Select and copy it.');}};
  $('#imp').onclick=()=>{try{const d=JSON.parse(bak.value);if(d&&d.entries){db=normalize(d);save();render();closeSheet();alert('Imported.');}else alert('Not a valid backup.');}catch(e){alert('Not a valid backup.');}};
  $('#clr').onclick=()=>{if(confirm('Delete every logged day, session and review? This cannot be undone.')){db=normalize({});save();render();closeSheet();}};
  $('#close').onclick=closeSheet;
  $('#sheet').classList.add('open');
}
function closeSheet(){$('#sheet').classList.remove('open');}
$('#sheet').onclick=ev=>{if(ev.target.id==='sheet')closeSheet();};
$('#setBtn').onclick=openSheet;
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();});

// ---------- shell ----------
function render(){
  killCharts();
  const weekly=tab==='stats';
  const d=parse(cur);
  $('#dateLabel').innerHTML=weekly?`Wk ${short(weekStart(cur))}<small>${weekStart(cur)===weekStart(today())?'this week':'tap for this week'}</small>`:`${DAYN[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}<small>${cur===today()?'Today':'editing · tap for today'}</small>`;
  $('#nextDay').disabled=weekly?weekStart(cur)>=weekStart(today()):cur>=today();
  const T=TABS.find(x=>x[0]===tab);
  $('#brandSub').textContent=tab==='gym'?trainingLabel(cur):T[2];
  $('#pageTitle').textContent=T[1];$('#pageSub').textContent=tab==='gym'?`${trainingLabel(cur)} · ${fmtL(cur)}`:`${T[2]} · ${fmtL(cur)}`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['today','work','gym','food','stats'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==tab));
  ({today:renderToday,work:renderWork,gym:renderGym,food:renderFood,stats:renderStats})[tab]();
}
$('#prevDay').onclick=()=>{cur=addDays(cur,tab==='stats'?-7:-1);render();};
$('#nextDay').onclick=()=>{const n=addDays(cur,tab==='stats'?7:1);if(n<=today()){cur=n;render();}};
$('#dateLabel').onclick=()=>{cur=today();render();};
$('#dateLabel').onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){cur=today();render();}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(cur>today())cur=today();if(user)pull();render();}});
render();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ready')));
$('#cloudBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .4-9 7 7 0 0 0-13.6 2A4 4 0 0 0 6 19z"/></svg>';
$('#cloudBtn').onclick=openSheet;
$('#tpill').onclick=()=>switchTab('work');
tick();
window.addEventListener('online',()=>{if(user)pull();});
initAuth();
</script>
</body>
</html>
